<!-- ============================================================== -->
<!-- 9:16 INSTAGRAM / WHATSAPP STATUS STORY STUDIO & REPLY MODAL   -->
<!-- ============================================================== -->
<style>
    /* Modal Backdrop */
    .story-modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(8, 11, 18, 0.88);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        z-index: 999999;
        align-items: center;
        justify-content: center;
        padding: 16px;
        overflow-y: auto;
    }
    .story-modal-overlay.active {
        display: flex;
        animation: modalFadeIn 0.25s ease-out;
    }

    @keyframes modalFadeIn {
        from { opacity: 0; transform: scale(0.97); }
        to { opacity: 1; transform: scale(1); }
    }

    .story-studio-modal {
        background: #111827;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 28px;
        padding: 24px 20px;
        width: 100%;
        max-width: 520px;
        max-height: 92vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 46, 116, 0.2);
        position: relative;
        color: #FFFFFF;
        box-sizing: border-box;
    }

    .story-studio-modal::-webkit-scrollbar {
        width: 6px;
    }
    .story-studio-modal::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
    }

    .modal-close-icon {
        position: absolute;
        top: 16px;
        right: 18px;
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: #FFF;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
    }
    .modal-close-icon:hover {
        background: rgba(255, 46, 116, 0.4);
        transform: rotate(90deg);
    }

    .studio-header {
        text-align: center;
        margin-bottom: 14px;
        width: 100%;
        padding-right: 28px;
    }
    .studio-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(37, 211, 102, 0.15);
        color: #25D366;
        border: 1px solid rgba(37, 211, 102, 0.35);
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
    }
    .studio-title {
        font-size: 20px;
        font-weight: 900;
        color: #FFF;
        margin: 0 0 2px 0;
        letter-spacing: -0.3px;
    }
    .studio-subtitle {
        font-size: 12px;
        color: #94A3B8;
        margin: 0;
    }

    /* 9:16 Canvas Preview Frame */
    .story-canvas-wrapper {
        width: 250px;
        height: 444px;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(255, 255, 255, 0.1);
        margin: 10px 0 16px 0;
        background: #000;
        position: relative;
        flex-shrink: 0;
    }
    #storyCanvas {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* Controls Section */
    .studio-controls-box {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .control-label {
        font-size: 12px;
        font-weight: 800;
        color: #E2E8F0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
    }

    /* Reply Input */
    .reply-input-wrap {
        position: relative;
        width: 100%;
    }
    .story-reply-textarea {
        width: 100%;
        background: rgba(15, 23, 42, 0.85);
        border: 1.5px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        padding: 12px 14px;
        color: #FFF;
        font-size: 14px;
        font-family: inherit;
        resize: none;
        outline: none;
        box-sizing: border-box;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .story-reply-textarea:focus {
        border-color: #25D366;
        box-shadow: 0 0 15px rgba(37, 211, 102, 0.25);
    }
    .story-reply-textarea::placeholder {
        color: #64748B;
        font-size: 13px;
    }

    /* Quick Reply Reaction Chips */
    .quick-chips-row {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 4px;
        margin-top: 6px;
        scrollbar-width: none;
    }
    .quick-chips-row::-webkit-scrollbar {
        display: none;
    }
    .reaction-chip {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #E2E8F0;
        padding: 5px 11px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s;
        flex-shrink: 0;
    }
    .reaction-chip:hover {
        background: rgba(255, 255, 255, 0.18);
        transform: translateY(-1px);
        color: #FFF;
    }

    /* Theme Picker Swatches */
    .theme-swatches-row {
        display: flex;
        align-items: center;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: none;
    }
    .theme-swatches-row::-webkit-scrollbar {
        display: none;
    }
    .theme-swatch {
        flex: 1;
        min-width: 68px;
        height: 38px;
        border-radius: 12px;
        cursor: pointer;
        border: 2px solid transparent;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 800;
        color: #FFF;
        text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        transition: transform 0.15s, border-color 0.15s;
        flex-shrink: 0;
    }
    .theme-swatch:hover {
        transform: scale(1.05);
    }
    .theme-swatch.active {
        border-color: #FFF;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
    }

    /* Toggle Switches */
    .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(255, 255, 255, 0.05);
        padding: 9px 14px;
        border-radius: 14px;
        font-size: 12px;
        font-weight: 600;
        color: #CBD5E1;
    }
    .toggle-switch {
        position: relative;
        display: inline-block;
        width: 38px;
        height: 22px;
        margin: 0;
    }
    .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }
    .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #475569;
        transition: .3s;
        border-radius: 22px;
    }
    .slider:before {
        position: absolute;
        content: "";
        height: 16px;
        width: 16px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: .3s;
        border-radius: 50%;
    }
    input:checked + .slider {
        background-color: #25D366;
    }
    input:checked + .slider:before {
        transform: translateX(16px);
    }

    /* Primary & Secondary Action Buttons */
    .studio-actions-wrap {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        margin-top: 6px;
    }
    .btn-studio-whatsapp {
        width: 100%;
        background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
        color: #FFF;
        border: none;
        padding: 14px 20px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 8px 24px rgba(37, 211, 102, 0.4);
        transition: all 0.2s;
        box-sizing: border-box;
    }
    .btn-studio-whatsapp:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(37, 211, 102, 0.55);
    }

    .studio-button-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        width: 100%;
    }
    .btn-studio-secondary {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #FFF;
        padding: 11px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: all 0.2s;
        box-sizing: border-box;
    }
    .btn-studio-secondary:hover {
        background: rgba(255, 255, 255, 0.18);
        transform: translateY(-1px);
    }

    /* Floating Toast Guidance Notification */
    .studio-toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: #0F172A;
        border: 1.5px solid #25D366;
        color: #FFF;
        padding: 14px 22px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 800;
        box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 25px rgba(37, 211, 102, 0.35);
        z-index: 1000000;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
        opacity: 0;
        pointer-events: none;
        max-width: 90vw;
        text-align: center;
    }
    .studio-toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
        pointer-events: auto;
    }
</style>

<!-- Story Reply Modal Container -->
<div class="story-modal-overlay" id="storyModalOverlay" onclick="handleBackdropClick(event)">
    <div class="story-studio-modal" id="storyStudioModal" onclick="event.stopPropagation()">
        <button type="button" class="modal-close-icon" onclick="closeStoryModal()">&times;</button>

        <div class="studio-header">
            <span class="studio-badge">📲 WhatsApp Status Reply Studio</span>
            <h3 class="studio-title">Reply to Anonymous Secret</h3>
            <p class="studio-subtitle">Live 9:16 card ready to share directly to your Status</p>
        </div>

        <!-- 9:16 Story Card Live Preview -->
        <div class="story-canvas-wrapper">
            <canvas id="storyCanvas" width="1080" height="1920"></canvas>
        </div>

        <div class="studio-controls-box">
            <!-- 1. Custom Reply Box -->
            <div>
                <label class="control-label" for="storyReplyInput">
                    <span>✍️</span>
                    <span>Your Reply / Comeback</span>
                </label>
                <div class="reply-input-wrap">
                    <textarea 
                        id="storyReplyInput" 
                        class="story-reply-textarea" 
                        rows="2" 
                        placeholder="Type your reaction... (e.g. Haha reveal yourself in DMs! 😂)"
                        maxlength="160"
                        oninput="onReplyInputChange()"></textarea>
                </div>

                <!-- Quick Reaction Chips -->
                <div class="quick-chips-row">
                    <button type="button" class="reaction-chip" onclick="applyQuickReaction('Haha who is this?? Reveal yourself! 😂')">😂 Who is this?!</button>
                    <button type="button" class="reaction-chip" onclick="applyQuickReaction('Slide into my DMs right now! 💬')">💬 Slide in DMs</button>
                    <button type="button" class="reaction-chip" onclick="applyQuickReaction('Aww thank you so much! 🥰')">🥰 Thank you!</button>
                    <button type="button" class="reaction-chip" onclick="applyQuickReaction('Haha never in a million years 💀')">💀 Never haha</button>
                    <button type="button" class="reaction-chip" onclick="applyQuickReaction('Say it to my face next time 😈')">😈 Say to my face</button>
                    <button type="button" class="reaction-chip" onclick="applyQuickReaction('Vibe check 100% approved 🔥')">🔥 Vibe approved</button>
                </div>
            </div>

            <!-- 2. Story Card Theme Picker -->
            <div>
                <label class="control-label">
                    <span>🎨</span>
                    <span>Card Aesthetic Theme</span>
                </label>
                <div class="theme-swatches-row">
                    <div class="theme-swatch active" style="background: linear-gradient(135deg, #FF0844 0%, #FF4E50 50%, #F9D423 100%);" onclick="selectStoryTheme('sunset', this)">Sunset</div>
                    <div class="theme-swatch" style="background: linear-gradient(135deg, #0F0C29 0%, #302B63 50%, #24243E 100%);" onclick="selectStoryTheme('midnight', this)">Cyber</div>
                    <div class="theme-swatch" style="background: linear-gradient(135deg, #111827 0%, #1F2937 50%, #0B0F17 100%);" onclick="selectStoryTheme('dark', this)">OLED</div>
                    <div class="theme-swatch" style="background: linear-gradient(135deg, #0575E6 0%, #00F260 100%);" onclick="selectStoryTheme('emerald', this)">Mint</div>
                    <div class="theme-swatch" style="background: linear-gradient(135deg, #B91D73 0%, #F953C6 100%);" onclick="selectStoryTheme('berry', this)">Berry</div>
                </div>
            </div>

            <!-- 3. Toggle Options -->
            <div class="toggle-row">
                <span>📱 Show Device Hint (e.g. iPhone • Campus)</span>
                <label class="toggle-switch">

                    <span class="slider"></span>
                </label>

            <!-- 4. Action Buttons -->
            <div class="studio-actions-wrap">
                <!-- Main WhatsApp Share Button -->
                <button type="button" class="btn-studio-whatsapp" onclick="shareStoryToWhatsApp()">
                    <span>📲 Share to WhatsApp Status</span>
                </button>

                <!-- Secondary Actions -->
                <div class="studio-button-grid">
                    <button type="button" class="btn-studio-secondary" onclick="postAsWhatsAppText()">
                        <span>💬 Post as Text Status</span>
                    </button>
                    <button type="button" class="btn-studio-secondary" onclick="downloadStoryImage()">
                        <span>⬇️ Save HD Image</span>
                    </button>
                </div>

                <button type="button" class="btn-studio-secondary" style="width: 100%;" onclick="copyStoryCaptionOnly()">
                    <span>📋 Copy Reply Text & Link</span>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Floating Toast Notification -->
<div class="studio-toast" id="studioToast">
    <span id="studioToastIcon">✨</span>
    <span id="studioToastText">Story Card Downloaded!</span>
</div>

<script>
    // Global Studio State
    let currentStoryText = "";
    let currentStoryPrompt = "Send me anonymous confessions";
    let currentStoryDevice = "Mobile Device";
    let currentStoryLocation = "Campus Area";
    let currentStoryMsgId = "";
    let currentStoryTheme = "sunset";

    const THEME_CONFIGS = {
        sunset: {
            bgGrad: ['#FF0844', '#FF4E50', '#F9D423'],
            accentColor: '#FF2E74',
            replyBg: 'rgba(0, 0, 0, 0.45)',
            replyBorder: 'rgba(255, 255, 255, 0.4)',
            glowColor: 'rgba(255, 255, 255, 0.12)'
        },
        midnight: {
            bgGrad: ['#0F0C29', '#302B63', '#24243E'],
            accentColor: '#A855F7',
            replyBg: 'rgba(0, 0, 0, 0.55)',
            replyBorder: 'rgba(168, 85, 247, 0.5)',
            glowColor: 'rgba(168, 85, 247, 0.2)'
        },
        dark: {
            bgGrad: ['#0B0E14', '#161B22', '#0A0D13'],
            accentColor: '#38BDF8',
            replyBg: 'rgba(255, 255, 255, 0.08)',
            replyBorder: 'rgba(255, 255, 255, 0.25)',
            glowColor: 'rgba(56, 189, 248, 0.15)'
        },
        emerald: {
            bgGrad: ['#0575E6', '#00F260', '#10B981'],
            accentColor: '#10B981',
            replyBg: 'rgba(0, 0, 0, 0.45)',
            replyBorder: 'rgba(255, 255, 255, 0.4)',
            glowColor: 'rgba(0, 242, 96, 0.18)'
        },
        berry: {
            bgGrad: ['#B91D73', '#E11D48', '#F953C6'],
            accentColor: '#F43F5E',
            replyBg: 'rgba(0, 0, 0, 0.45)',
            replyBorder: 'rgba(255, 255, 255, 0.4)',
            glowColor: 'rgba(249, 83, 198, 0.2)'
        }
    };

    function showToast(text, icon = '✨') {
        const toast = document.getElementById('studioToast');
        const textEl = document.getElementById('studioToastText');
        const iconEl = document.getElementById('studioToastIcon');
        if (!toast || !textEl) return;
        textEl.innerText = text;
        if (iconEl) iconEl.innerText = icon;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3200);
    }

    function handleBackdropClick(e) {
        if (e.target.id === 'storyModalOverlay') {
            closeStoryModal();
        }
    }

    function closeStoryModal() {
        const overlay = document.getElementById('storyModalOverlay');
        if (overlay) overlay.classList.remove('active');
    }

    // Main Entrypoint: Open Story Reply Modal
    function openStoryReplyModal(confessionText, promptText, deviceHint, locationHint, msgId) {
        currentStoryText = confessionText || "Anonymous message";
        currentStoryPrompt = promptText || "Send me anonymous confessions";
        currentStoryDevice = deviceHint || "Mobile Device";
        currentStoryLocation = locationHint || "Campus Area";
        currentStoryMsgId = msgId || "";

        // Reset reply input
        const replyInput = document.getElementById('storyReplyInput');
        if (replyInput) replyInput.value = "";

        const overlay = document.getElementById('storyModalOverlay');
        if (overlay) overlay.classList.add('active');

        // Mark as read in background if message ID provided
        if (currentStoryMsgId) {
            try {
                fetch('/api/ngl/inbox/read', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message_id: currentStoryMsgId })
                });

                // Update UI elements for unread state
                const card = document.getElementById(`card-${currentStoryMsgId}`);
                if (card) card.classList.remove('unread');
                const dashCard = document.getElementById(`dash-card-${currentStoryMsgId}`);
                if (dashCard) dashCard.classList.remove('unread');
            } catch (e) {
                console.warn('Could not mark message as read', e);
            }
        }

        renderStoryCanvas();
    }

    // Safe Helper: Open via ID lookup
    function openStoryReplyModalById(msgId) {
        let found = null;
        if (typeof INBOX_DATA !== 'undefined' && Array.isArray(INBOX_DATA)) {
            found = INBOX_DATA.find(m => m.id === msgId);
        }
        if (!found && typeof window.NGL_INBOX_MESSAGES !== 'undefined') {
            found = window.NGL_INBOX_MESSAGES.find(m => m.id === msgId);
        }

        if (found) {
            openStoryReplyModal(found.text, found.prompt, found.device_hint, found.location_hint, found.id);
        } else {
            // Fallback: read directly from card DOM attributes
            const cardEl = document.getElementById(`card-${msgId}`) || document.getElementById(`dash-card-${msgId}`);
            if (cardEl) {
                const text = cardEl.getAttribute('data-text') || "Anonymous message";
                const prompt = cardEl.getAttribute('data-prompt') || "Send me anonymous confessions";
                const dev = cardEl.getAttribute('data-device') || "Mobile Device";
                const loc = cardEl.getAttribute('data-location') || "Campus Area";
                openStoryReplyModal(text, prompt, dev, loc, msgId);
            }
        }
    }

    function onReplyInputChange() {
        renderStoryCanvas();
    }

    function applyQuickReaction(text) {
        const input = document.getElementById('storyReplyInput');
        if (input) {
            input.value = text;
            renderStoryCanvas();
        }
    }

    function selectStoryTheme(themeKey, swatchEl) {
        currentStoryTheme = themeKey;
        document.querySelectorAll('.theme-swatch').forEach(s => s.classList.remove('active'));
        if (swatchEl) swatchEl.classList.add('active');
        renderStoryCanvas();
    }

    // ==========================================
    // 9:16 HTML5 CANVAS STORY CARD RENDERER
    // ==========================================
    function renderStoryCanvas() {
        const canvas = document.getElementById('storyCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = canvas.width;   // 1080
        const H = canvas.height;  // 1920

        const theme = THEME_CONFIGS[currentStoryTheme] || THEME_CONFIGS.sunset;
        const userReply = (document.getElementById('storyReplyInput')?.value || "").trim();
        const showDevice = document.getElementById('toggleDeviceHint')?.checked ?? true;
        const activeSlug = (typeof NGL_SLUG !== 'undefined' && NGL_SLUG) ? NGL_SLUG : (typeof userSlug !== 'undefined' ? userSlug : 'findyourmatch');

        // 1. Dynamic Background Gradient
        const grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, theme.bgGrad[0]);
        grad.addColorStop(0.5, theme.bgGrad[1]);
        grad.addColorStop(1, theme.bgGrad[2]);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // Ambient radial light halos
        ctx.fillStyle = theme.glowColor;
        ctx.beginPath();
        ctx.arc(W / 2, 420, 480, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(W / 2, 1400, 420, 0, Math.PI * 2);
        ctx.fill();

        // 2. Top Header Brand Pill
        const pillW = 600;
        const pillH = 76;
        const pillX = (W - pillW) / 2;
        const pillY = 160;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        roundRect(ctx, pillX, pillY, pillW, pillH, 38, true, false);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 30px "Plus Jakarta Sans", -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🤫 FINDYOURMATCH • ANONYMOUS', W / 2, pillY + pillH / 2);

        // 3. User Prompt Box (The question/game prompt)
        const promptBoxW = 920;
        const promptBoxH = 150;
        const promptBoxX = (W - promptBoxW) / 2;
        const promptBoxY = 270;

        ctx.fillStyle = '#FFFFFF';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
        ctx.shadowBlur = 25;
        ctx.shadowOffsetY = 10;
        roundRect(ctx, promptBoxX, promptBoxY, promptBoxW, promptBoxH, 28, true, false);
        ctx.shadowColor = 'transparent';

        ctx.fillStyle = '#0F172A';
        ctx.font = 'bold 35px "Plus Jakarta Sans", -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        wrapText(ctx, currentStoryPrompt, W / 2, promptBoxY + 75, 840, 46, 2);

        // 4. Main Anonymous Confession Card (Translucent White Card)
        const cardW = 920;
        let cardH = userReply ? 580 : 660; // adjust height if reply is present
        const cardX = (W - cardW) / 2;
        const cardY = 460;

        ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
        ctx.shadowBlur = 35;
        ctx.shadowOffsetY = 15;
        roundRect(ctx, cardX, cardY, cardW, cardH, 36, true, false);
        ctx.shadowColor = 'transparent';

        // Quotation mark icon
        ctx.fillStyle = theme.accentColor;
        ctx.font = '900 100px "Plus Jakarta Sans", serif';
        ctx.textAlign = 'left';
        ctx.fillText('“', cardX + 50, cardY + 110);

        // Confession Text sizing based on length
        const confLen = currentStoryText.length;
        let confFontSize = 50;
        let confLineHeight = 66;
        if (confLen > 240) {
            confFontSize = 34;
            confLineHeight = 48;
        } else if (confLen > 120) {
            confFontSize = 42;
            confLineHeight = 56;
        }

        ctx.fillStyle = '#0F172A';
        ctx.font = `bold ${confFontSize}px "Plus Jakarta Sans", -apple-system, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        wrapText(ctx, currentStoryText, W / 2, cardY + (cardH / 2) - 10, 800, confLineHeight, 5);

        // Bottom Secret Tag inside Confession Box
        let footerText = '🔒 100% Anonymous Confession';
        if (showDevice && currentStoryDevice) {
            footerText = `🔒 Anonymous • 📱 ${currentStoryDevice}`;
        }
        ctx.fillStyle = '#94A3B8';
        ctx.font = 'bold 26px "Plus Jakarta Sans", -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(footerText, W / 2, cardY + cardH - 45);

        // 5. User's Reply Bubble (The response)
        const replyBoxW = 920;
        const replyBoxH = userReply ? 380 : 310;
        const replyBoxX = (W - replyBoxW) / 2;
        const replyBoxY = cardY + cardH + 30;

        ctx.fillStyle = theme.replyBg;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
        ctx.shadowBlur = 20;
        roundRect(ctx, replyBoxX, replyBoxY, replyBoxW, replyBoxH, 32, true, false);
        ctx.shadowColor = 'transparent';

        ctx.strokeStyle = theme.replyBorder;
        ctx.lineWidth = 3.5;
        roundRect(ctx, replyBoxX, replyBoxY, replyBoxW, replyBoxH, 32, false, true);

        // Reply Header Pill
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 30px "Plus Jakarta Sans", -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('💬 MY REPLY', W / 2, replyBoxY + 65);

        if (userReply) {
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 44px "Plus Jakarta Sans", -apple-system, sans-serif';
            ctx.textAlign = 'center';
            wrapText(ctx, userReply, W / 2, replyBoxY + 180, 820, 56, 3);
        } else {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.font = 'italic 34px "Plus Jakarta Sans", -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('✍️ Type your reply above or post on status...', W / 2, replyBoxY + 160);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
            ctx.font = '500 26px "Plus Jakarta Sans", -apple-system, sans-serif';
            ctx.fillText('Followers will see your response on your WhatsApp Status!', W / 2, replyBoxY + 225);
        }

        // 6. Bottom Viral Link Sticker
        const linkPillW = 680;
        const linkPillH = 74;
        const linkPillX = (W - linkPillW) / 2;
        const linkPillY = 1760;

        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        roundRect(ctx, linkPillX, linkPillY, linkPillW, linkPillH, 37, true, false);

        ctx.fillStyle = '#0F172A';
        ctx.font = 'bold 28px "Plus Jakarta Sans", -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`👉 ngl.link/${activeSlug} • Send me secret msgs`, W / 2, linkPillY + linkPillH / 2);
    }

    // Helper: Rounded Rectangle
    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
    }

    // Helper: Smart Multi-line Text Wrap
    function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 5) {
        if (!text) return;
        const words = text.split(/\s+/);
        let line = '';
        const lines = [];

        for (let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            const metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                lines.push(line.trim());
                line = words[n] + ' ';
            } else {
                line = testLine;
            }
        }
        lines.push(line.trim());

        // Cap to maxLines
        if (lines.length > maxLines) {
            lines.length = maxLines;
            lines[maxLines - 1] += '...';
        }

        const startY = y - ((lines.length - 1) * lineHeight) / 2;
        for (let i = 0; i < lines.length; i++) {
            ctx.fillText(lines[i], x, startY + (i * lineHeight));
        }
    }

    // ==========================================
    // ACTION HANDLERS
    // ==========================================

    function getFullNglLink() {
        if (typeof NGL_FULL_LINK !== 'undefined' && NGL_FULL_LINK) return NGL_FULL_LINK;
        if (typeof fullLink !== 'undefined' && fullLink) return fullLink;
        const slug = (typeof NGL_SLUG !== 'undefined' && NGL_SLUG) ? NGL_SLUG : (typeof userSlug !== 'undefined' ? userSlug : 'me');
        return `${window.location.origin}/ngl/${slug}`;
    }

    // 1. Post to WhatsApp (Native Share or Fallback)
    async function shareStoryToWhatsApp() {
        const canvas = document.getElementById('storyCanvas');
        if (!canvas) return;

        const replyText = (document.getElementById('storyReplyInput')?.value || "").trim();
        const link = getFullNglLink();

        let caption = `Replying to anonymous confession! 🤫\n\n`;
        caption += `"${currentStoryText}"\n`;
        if (replyText) {
            caption += `👉 My Reply: ${replyText}\n\n`;
        } else {
            caption += `\n`;
        }
        caption += `Send me anonymous confessions here 👇\n${link}`;

        // Try copying caption to clipboard right away
        try {
            await navigator.clipboard.writeText(caption);
        } catch (e) {}

        // Try Web Share API with image file
        if (navigator.share && navigator.canShare) {
            try {
                canvas.toBlob(async (blob) => {
                    const file = new File([blob], `ngl_reply_${Date.now()}.png`, { type: 'image/png' });
                    if (navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'NGL Confession Reply',
                                text: caption
                            });
                            showToast('Opening WhatsApp! Tap "My Status" to post 📲', '🎉');
                            return;
                        } catch (err) {
                            if (err.name !== 'AbortError') {
                                fallbackWhatsAppFlow(caption);
                            }
                        }
                    } else {
                        fallbackWhatsAppFlow(caption);
                    }
                }, 'image/png');
                return;
            } catch (shareErr) {
                console.log('Native share failed:', shareErr);
            }
        }

        fallbackWhatsAppFlow(caption);
    }

    // Fallback: Download Image + Copy Caption + Open WhatsApp
    function fallbackWhatsAppFlow(caption) {
        downloadStoryImage();
        showToast('Image downloaded & Caption copied! Opening WhatsApp...', '📲');

        setTimeout(() => {
            const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(caption)}`;
            window.open(waUrl, '_blank');
        }, 1200);
    }

    // 2. Post Direct Text Status
    function postAsWhatsAppText() {
        const replyText = (document.getElementById('storyReplyInput')?.value || "").trim();
        const link = getFullNglLink();

        let text = `🤫 *ANONYMOUS CONFESSION:*\n"${currentStoryText}"\n\n`;
        if (replyText) {
            text += `💬 *MY REPLY:*\n${replyText}\n\n`;
        }
        text += `🔥 *Send me secret confessions & truths here:* 👇\n${link}`;

        showToast('Opening WhatsApp Status...', '📲');
        const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
        window.open(waUrl, '_blank');
    }

    // 3. Download Crisp 1080x1920 PNG
    function downloadStoryImage() {
        const canvas = document.getElementById('storyCanvas');
        if (!canvas) return;

        const downloadLink = document.createElement('a');
        downloadLink.download = `ngl_confession_reply_${Date.now()}.png`;
        downloadLink.href = canvas.toDataURL('image/png');
        downloadLink.click();
        showToast('HD 9:16 Story Card saved to Gallery!', '⬇️');
    }

    // 4. Copy Caption & Link
    function copyStoryCaptionOnly() {
        const replyText = (document.getElementById('storyReplyInput')?.value || "").trim();
        const link = getFullNglLink();

        let text = `🤫 ANONYMOUS CONFESSION:\n"${currentStoryText}"\n\n`;
        if (replyText) {
            text += `💬 MY REPLY:\n${replyText}\n\n`;
        }
        text += `👉 Send me anonymous confessions here:\n${link}`;

        navigator.clipboard.writeText(text).then(() => {
            showToast('Reply text & link copied to clipboard!', '📋');
        }).catch(() => {
            prompt('Copy your reply text:', text);
        });
    }
