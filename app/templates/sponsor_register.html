{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl overflow-hidden mt-10">
    <div class="bg-gradient-to-r from-blue-900 to-blue-700 p-8 text-center text-white">
        <h2 class="text-3xl font-black mb-2">Become a Sponsor</h2>
        <p class="text-white/90 font-medium">Join FindYourMatch to connect with students.</p>
        <div class="mt-4 inline-block bg-white/20 px-4 py-2 rounded-full text-sm font-bold backdrop-blur-sm">
            Registration Fee: KES {{ fee }}
        </div>
    </div>

    <form action="{{ url_for('sponsors.sponsor_register') }}" method="POST" class="p-8 space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Full Name</label>
            <input type="text" name="name" required
                   class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-blue-600 focus:ring-0 transition-colors font-medium">
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Email Address</label>
            <input type="email" name="email" required
                   class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-blue-600 focus:ring-0 transition-colors font-medium">
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">M-Pesa Phone Number</label>
            <input type="tel" name="phone" placeholder="e.g. 0712345678" required
                   class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-blue-600 focus:ring-0 transition-colors font-medium">
        </div>
        
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Password</label>
            <input type="password" name="password" required
                   class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-blue-600 focus:ring-0 transition-colors font-medium">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Gender</label>
                <select name="gender" required class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-red-500 focus:ring-0 transition-colors font-medium">
                    <option value="">Select...</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Age</label>
                <input type="number" name="age" min="18" max="99" required
                       class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-blue-600 focus:ring-0 transition-colors font-medium">
            </div>
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">County / City</label>
            <input type="text" name="county" required placeholder="e.g. Nairobi"
                   class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-blue-600 focus:ring-0 transition-colors font-medium">
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">A short bio about you</label>
            <textarea name="bio" rows="3" required placeholder="What are you looking for?"
                      class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-blue-600 focus:ring-0 transition-colors font-medium"></textarea>
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl transition-all active:scale-95 shadow-lg shadow-blue-200">
            Pay KES {{ fee }} & Register
        </button>

        <p class="text-center text-gray-500 text-sm font-medium mt-4">
            Already a sponsor? <a href="{{ url_for('sponsors.sponsor_login') }}" class="text-blue-600 hover:underline">Log in here</a>
        </p>
    </form>
</div>
{% endblock %}
