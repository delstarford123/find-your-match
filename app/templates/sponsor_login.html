{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl overflow-hidden mt-10">
    <div class="bg-gradient-to-r from-red-600 to-red-500 p-8 text-center text-white">
        <div class="text-4xl mb-4">🌟</div>
        <h2 class="text-3xl font-black mb-2">Sponsor Login</h2>
        <p class="text-white/90 font-medium">Welcome back!</p>
    </div>

    <form action="{{ url_for('sponsors.sponsor_login') }}" method="POST" class="p-8 space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Email Address</label>
            <input type="email" name="email" required
                   class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-red-500 focus:ring-0 transition-colors font-medium">
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Password</label>
            <input type="password" name="password" required
                   class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-red-500 focus:ring-0 transition-colors font-medium">
        </div>

        <button type="submit"
                class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-2xl transition-all active:scale-95 shadow-lg shadow-red-200">
            Sign In
        </button>

        <p class="text-center text-gray-500 text-sm font-medium mt-4">
            Don't have an account? <a href="{{ url_for('sponsors.sponsor_register') }}" class="text-red-600 hover:underline">Register here</a>
        </p>
    </form>
</div>
{% endblock %}
