{% extends "base.html" %}

{% block content %}
<style>
    /* Mysterious Dark Theme */
    .lights-out-container {
        max-width: 600px;
        margin: 0 auto;
        padding: 40px 20px 100px;
        color: #fff;
        text-align: center;
        position: relative;
        z-index: 10;
    }

    .neon-title {
        font-size: 36px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #fff;
        text-shadow: 0 0 10px #E60026, 0 0 20px #E60026, 0 0 40px #E60026;
        margin-bottom: 10px;
        animation: flicker 3s infinite alternate;
    }

    @keyframes flicker {
        0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { text-shadow: 0 0 10px #E60026, 0 0 20px #E60026; opacity: 1; }
        20%, 24%, 55% { text-shadow: none; opacity: 0.5; }
    }

    /* Lobby State */
    #lobby-state {
        margin-top: 50px;
    }

    .btn-join-queue {
        background: #E60026;
        color: white;
        border: none;
        padding: 18px 40px;
        font-size: 20px;
        font-weight: 900;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(230, 0, 38, 0.6);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .btn-join-queue:hover {
        transform: scale(1.05);
        box-shadow: 0 0 40px rgba(230, 0, 38, 0.8);
    }

    .spinner {
        display: none;
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255,255,255,0.1);
        border-top-color: #E60026;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 30px auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Chat State */
    #chat-state {
        display: none;
        flex-direction: column;
        height: 70vh;
        background: rgba(11, 18, 25, 0.8);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(230, 0, 38, 0.3);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .timer-display {
        font-size: 32px;
        font-weight: 900;
        color: #E60026;
        margin-bottom: 15px;
        font-variant-numeric: tabular-nums;
    }

    .chat-box {
        flex-grow: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 15px;
        text-align: left;
    }

    .msg-bubble {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 15px;
        line-height: 1.4;
    }

    .msg-sent {
        background: #E60026;
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }

    .msg-received {
        background: rgba(255,255,255,0.1);
        color: white;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
    }

    .chat-input-area {
        display: flex;
        gap: 10px;
    }

    .chat-input-area input {
        flex-grow: 1;
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.2);
        color: white;
        padding: 15px;
        border-radius: 30px;
        outline: none;
    }

    .chat-input-area button {
        background: #E60026;
        color: white;
        border: none;
        width: 50px;
        border-radius: 50%;
        cursor: pointer;
        font-weight: bold;
    }

    /* Reveal Modal */
    #reveal-modal {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.9);
        border-radius: 20px;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 100;
    }
</style>

<div class="lights-out-container">
    <h1 class="neon-title">Lights Out</h1>
    <p style="color: #94A3B8;">3 minutes. Pure conversation. No pictures.</p>

    <div id="lobby-state">
        <button class="btn-join-queue" id="btn-join" onclick="joinQueue()">Enter the Dark</button>
        <div class="spinner" id="queue-spinner"></div>
        <p id="queue-status" style="margin-top: 20px; color: #E60026; font-weight: bold; display: none;">Searching for a stranger in the dark...</p>
    </div>

    <div id="chat-state">
        <div class="timer-display" id="timer">03:00</div>
        <div class="chat-box" id="chat-box">
            <div class="msg-bubble msg-received">A stranger has entered the chat. Say hi!</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">➤</button>
        </div>

        <div id="reveal-modal">
            <h2 style="color:white; margin-bottom: 20px;">Time's Up!</h2>
            <p style="margin-bottom: 30px;">Did you feel a spark? Reveal identities?</p>
            <div style="display: flex; gap: 15px;">
                <button class="btn-join-queue" style="padding: 10px 30px; font-size:16px;" onclick="voteReveal()">Yes</button>
                <button class="btn-join-queue" style="background: #333; padding: 10px 30px; font-size:16px;" onclick="window.location.href='/dashboard'">No, Leave</button>
            </div>
            <p id="reveal-status" style="margin-top: 20px; font-size: 13px;"></p>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
    const firebaseConfig = { databaseURL: "{{ config['FIREBASE_DB_URL'] }}" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const fdb = firebase.database();
    
    const myId = "{{ session.get('user_id') }}";
    
    let currentRoom = null;
    let timerInterval;
    let secondsLeft = 180; // 3 minutes

    const lobbyState = document.getElementById('lobby-state');
    const chatState = document.getElementById('chat-state');
    const btnJoin = document.getElementById('btn-join');
    const spinner = document.getElementById('queue-spinner');
    const statusTxt = document.getElementById('queue-status');
    const chatBox = document.getElementById('chat-box');
    const timerDisplay = document.getElementById('timer');
    const revealModal = document.getElementById('reveal-modal');
    const revealStatus = document.getElementById('reveal-status');

    let queueRef = null;
    let roomRef = null;

    // Clean up if the user leaves the page while in queue
    window.addEventListener('beforeunload', () => {
        if (queueRef) queueRef.remove();
    });

    async function joinQueue() {
        btnJoin.style.display = 'none';
        spinner.style.display = 'block';
        statusTxt.style.display = 'block';
        statusTxt.innerText = "Searching for a stranger in the dark...";

        // 1. Check if anyone else is waiting
        const snapshot = await fdb.ref('lights_out_queue').orderByChild('timestamp').limitToFirst(1).once('value');
        let matched = false;
        
        if (snapshot.exists()) {
            snapshot.forEach((childSnap) => {
                const partnerId = childSnap.key;
                const partnerData = childSnap.val();
                
                if (partnerId !== myId && !partnerData.room_id) {
                    matched = true;
                    currentRoom = `lights_out_${[myId, partnerId].sort().join('_')}`;
                    
                    // Assign room to partner so they join too
                    fdb.ref(`lights_out_queue/${partnerId}`).update({ room_id: currentRoom });
                    joinRoom(currentRoom);
                }
            });
        }
        
        // 2. If no match found, enter queue and wait
        if (!matched) {
            statusTxt.innerText = "Waiting in the dark for a match...";
            queueRef = fdb.ref(`lights_out_queue/${myId}`);
            await queueRef.set({ timestamp: Date.now(), room_id: null });
            
            queueRef.on('value', snap => {
                const data = snap.val();
                if (data && data.room_id) {
                    currentRoom = data.room_id;
                    queueRef.remove();
                    queueRef = null;
                    joinRoom(currentRoom);
                }
            });
        }
    }

    function joinRoom(roomId) {
        roomRef = fdb.ref(`lights_out_rooms/${roomId}`);
        
        // Setup Chat Listeners
        roomRef.child('messages').on('child_added', snap => {
            const data = snap.val();
            if (data.sender !== myId) {
                chatBox.innerHTML += `<div class="msg-bubble msg-received">${data.message}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });

        // Setup Reveal Listeners
        roomRef.child('reveal').on('value', snap => {
            const data = snap.val();
            if (!data) return;
            
            if (data[myId] && !partnerVoted) {
                 // I voted, wait for partner
            }
            
            // Check if partner voted
            Object.keys(data).forEach(uid => {
                if (uid !== myId && data[uid] === true) {
                    partnerVoted = true;
                    checkRevealStatus();
                }
            });
        });

        lobbyState.style.display = 'none';
        chatState.style.display = 'flex';
        startTimer();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            secondsLeft--;
            let m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
            let s = (secondsLeft % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `${m}:${s}`;

            if (secondsLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById('msg-input').disabled = true;
                revealModal.style.display = 'flex';
            }
        }, 1000);
    }

    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (text && currentRoom) {
            chatBox.innerHTML += `<div class="msg-bubble msg-sent">${escapeHTML(text)}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            
            roomRef.child('messages').push({
                sender: myId,
                message: escapeHTML(text),
                timestamp: Date.now()
            });
            input.value = '';
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function escapeHTML(str) {
        if (!str) return '';
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    // === REVEAL LOGIC ===
    let iVoted = false;
    let partnerVoted = false;

    function voteReveal() {
        iVoted = true;
        roomRef.child('reveal').child(myId).set(true);
        checkRevealStatus();
    }

    function checkRevealStatus() {
        if (iVoted && !partnerVoted) {
            revealStatus.innerText = "Waiting for stranger's choice...";
        } else if (iVoted && partnerVoted) {
            revealStatus.innerText = "It's a Match! Generating connection...";
            revealStatus.style.color = "#10B981";
            
            setTimeout(() => {
                window.location.href = "/dashboard"; 
            }, 2000);
        }
    }
</script>
{% endblock %}
