<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Call | MMUST Dating</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* === NATIVE FULLSCREEN APP UI === */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #0B1219; color: white; font-family: 'Outfit', sans-serif; 
            overflow: hidden; height: 100vh; height: 100dvh; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; 
        }
        
        /* === DYNAMIC VIDEO SWAP LAYERS === */
        .video-container { position: absolute; inset: 0; z-index: 1; display: none; background: #000; }
        
        /* The video filling the screen */
        .video-main {
            position: absolute; inset: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: 1; transition: 0.3s ease-in-out;
        }
        
        /* The floating small video in the corner */
        .video-pip {
            position: absolute; bottom: 120px; right: 20px; 
            width: 110px; height: 160px; object-fit: cover; 
            border-radius: 16px; border: 2px solid rgba(255,255,255,0.8); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); 
            z-index: 5; background: #111; cursor: pointer;
            transition: 0.3s ease-in-out;
        }
        .video-pip:hover { transform: scale(1.05); }
        .mirrored { transform: scaleX(-1) !important; }
        .pip-hover:hover { transform: scale(1.05) scaleX(-1) !important; }
        
        /* === VOICE AVATAR LAYERS === */
        .avatar-container { z-index: 2; text-align: center; margin-bottom: 40px; transition: 0.3s; }
        
        .avatar { 
            width: 160px; height: 160px; border-radius: 50%; object-fit: cover; 
            border: 4px solid #38bdf8; margin-bottom: 24px; 
            animation: pulse 2s infinite; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        @keyframes pulse { 
            0% { box-shadow: 0 0 0 0 rgba(56,189,248,0.6); } 
            70% { box-shadow: 0 0 0 35px rgba(56,189,248,0); } 
            100% { box-shadow: 0 0 0 0 rgba(56,189,248,0); } 
        }
        
        h1 { margin: 0 0 10px 0; font-size: 32px; font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .status { color: #38bdf8; font-size: 18px; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,0.8); letter-spacing: 0.5px;}

        /* === NETWORK WARNING === */
        .network-warning {
            position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
            background: rgba(239, 68, 68, 0.9); color: white; padding: 6px 16px;
            border-radius: 20px; font-size: 13px; font-weight: 700; z-index: 10;
            display: none; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4);
        }

        /* === CONTROLS === */
        .controls { position: absolute; bottom: 40px; z-index: 10; display: flex; gap: 25px; }
        
        .btn { 
            width: 70px; height: 70px; border-radius: 50%; border: none; 
            cursor: pointer; font-size: 28px; display: flex; align-items: center; 
            justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.4); 
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.9); }
        .btn-hangup { background: #ef4444; color: white; }
        .btn-hangup:hover { background: #dc2626; }

        /* Extra control buttons */
        .btn-pip-sys { background: #1E293B; color: #38BDF8; font-size: 24px; border: 1px solid #334155; }
        .btn-pip-sys:hover { background: #334155; color: white; }
        
        .btn-magic { background: #1E293B; color: #A855F7; border: 1px solid #334155; }
        .btn-magic.active { background: rgba(168, 85, 247, 0.2); border-color: #A855F7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }

        /* === STUDIO GLOW FILTER === */
        .studio-glow {
            filter: brightness(1.1) contrast(1.05) saturate(1.2) sepia(0.1);
        }

        /* === SCROLLABLE 100-EMOJI REACTIONS UI === */
        .reaction-bar-container {
            position: absolute; right: 20px; top: 40%; transform: translateY(-50%);
            height: 55vh; width: 60px; z-index: 20; border-radius: 30px;
            background: rgba(11, 18, 25, 0.5); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1); display: none; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .reaction-scroll {
            height: 100%; overflow-y: auto; display: flex; flex-direction: column;
            align-items: center; gap: 15px; padding: 15px 0;
            /* Hide scrollbar for sleekness */
            -ms-overflow-style: none; scrollbar-width: none; 
        }
        .reaction-scroll::-webkit-scrollbar { display: none; }
        
        .react-btn {
            background: none; border: none; font-size: 28px; cursor: pointer;
            transition: 0.2s; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .react-btn:active { transform: scale(0.6); }
        .react-btn:hover { transform: scale(1.2); }

        /* Floating Emoji Animation Container */
        #reaction-layer {
            position: absolute; inset: 0; z-index: 15; pointer-events: none; overflow: hidden;
        }
        .floating-emoji {
            position: absolute; bottom: -50px; font-size: 50px;
            animation: floatUpAndFade 2.5s ease-out forwards;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }

        @keyframes floatUpAndFade {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            10% { transform: translateY(-50px) scale(1.2); opacity: 1; }
            50% { transform: translateY(-200px) scale(1) translateX(15px); opacity: 1; }
            100% { transform: translateY(-400px) scale(1.5) translateX(-20px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="network-warning" id="networkWarning">⚠️ Weak Connection</div>

    <div id="reaction-layer"></div>

    <div class="reaction-bar-container" id="reactionBar">
        <div class="reaction-scroll" id="reactionScroll">
            </div>
    </div>

    <div class="video-container" id="videoContainer">
        <video id="remoteVideo" class="video-main" autoplay playsinline onclick="handleVideoClick('remote')"></video>
        <video id="localVideo" class="video-pip mirrored pip-hover" autoplay playsinline muted onclick="handleVideoClick('local')"></video>
    </div>
    
    <div class="avatar-container" id="avatarContainer">
        <img src="{{ partner_img }}" class="avatar" id="partnerAvatar">
        <h1>{{ partner_name }}</h1>
        <div class="status" id="callStatus">Connecting...</div>
    </div>

    <div class="controls">
        <button class="btn btn-magic" id="btnGlow" onclick="toggleGlow()" title="Studio Glow">✨</button>
        <button class="btn btn-pip-sys" id="btnPipSys" onclick="toggleSystemPiP()" style="display: none;" title="Minimize Browser Video">⧉</button>
        <button class="btn btn-hangup" onclick="endCall()" title="End Call">📵</button>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.1/socket.io.js"></script>
    <script>
        // ==========================================
        // 1. INITIALIZATION & VARIABLES
        // ==========================================
        const socket = io();
        const myId = "{{ session.get('user_id') }}";
        const partnerId = "{{ partner_id }}";
        const action = "{{ action }}"; 
        const isVideoCall = {{ is_video | lower }};
        
        let pc = null;
        let localStream = null;
        let networkCheckInterval = null;
        let isCallConnected = false; 
        
        // Track which video is currently in the small corner
        let localIsPip = true; 
        
        let rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        socket.on('connect', () => { 
            socket.emit('join_call_room', { user_id: myId }); 
        });

        // ==========================================
        // 2. WHATSAPP-STYLE VIDEO SWAP
        // ==========================================
        function handleVideoClick(clickedType) {
            const localVid = document.getElementById('localVideo');
            const remoteVid = document.getElementById('remoteVideo');

            // Only swap if the user clicks the video that is currently SMALL (PiP)
            if (clickedType === 'local' && localIsPip) {
                // Local goes Fullscreen, Remote goes Small
                localVid.className = 'video-main mirrored';
                remoteVid.className = 'video-pip pip-hover';
                localIsPip = false;
            } else if (clickedType === 'remote' && !localIsPip) {
                // Remote goes Fullscreen, Local goes Small
                remoteVid.className = 'video-main';
                localVid.className = 'video-pip mirrored pip-hover';
                localIsPip = true;
            }
        }

        // ==========================================
        // 3. WEBRTC PEER CONNECTION SETUP
        // ==========================================
        function setupPeerConnection() {
            pc = new RTCPeerConnection(rtcConfig);
            
            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

            pc.ontrack = e => {
                if (isVideoCall) {
                    const rv = document.getElementById('remoteVideo');
                    rv.srcObject = e.streams[0];
                    rv.play().catch(err => console.warn('Video play override:', err));
                    
                    document.getElementById('avatarContainer').style.display = 'none';

                    if (document.pictureInPictureEnabled) {
                        document.getElementById('btnPipSys').style.display = 'flex';
                    }
                } else {
                    const ra = document.getElementById('remoteAudio');
                    ra.srcObject = e.streams[0];
                    ra.play().catch(err => console.warn('Audio play override:', err));
                }
            };

            pc.onicecandidate = e => {
                if (e.candidate) {
                    socket.emit('webrtc_ice_candidate', { target_id: partnerId, candidate: e.candidate });
                }
            };

            pc.oniceconnectionstatechange = () => {
                const warningEl = document.getElementById('networkWarning');
                if (pc.iceConnectionState === 'disconnected') {
                    warningEl.style.display = 'block';
                    warningEl.innerText = "⚠️ Reconnecting...";
                } else if (pc.iceConnectionState === 'connected') {
                    warningEl.style.display = 'none';
                } else if (pc.iceConnectionState === 'failed') {
                    warningEl.style.display = 'block';
                    warningEl.innerText = "❌ Connection Lost";
                    setTimeout(() => endCall(false), 3000);
                }
            };
        }

        function finalizeConnection() {
            document.getElementById('callStatus').innerText = "Connected! 🟢";
            document.getElementById('partnerAvatar').style.animation = 'none'; 
            isCallConnected = true; 
            
            if (isVideoCall) {
                document.getElementById('reactionBar').style.display = 'block';
            }
            startNetworkMonitor();
        }

        // ==========================================
        // 4. MASTER HANDSHAKE FLOW
        // ==========================================
        async function initWebRTC() {
            populateEmojis(); // Load the 100 emojis

            try {
                const res = await fetch('/api/turn-credentials');
                const data = await res.json();
                if (data.iceServers) rtcConfig.iceServers = data.iceServers;
            } catch(e) { console.warn("Using free STUN."); }

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
                if (isVideoCall) {
                    document.getElementById('videoContainer').style.display = 'block';
                    document.getElementById('localVideo').srcObject = localStream;
                }
            } catch (e) {
                alert("Microphone/Camera access denied!");
                window.location.href = '/talk';
                return;
            }

            if (action === 'call') {
                document.getElementById('callStatus').innerText = "Ringing...";
                socket.emit('call_invite', {
                    target_id: partnerId, 
                    caller_id: myId,
                    caller_name: "{{ session.get('user_name', 'Student').split()[0] }}",
                    caller_img: "{{ session.get('profile_img', '/static/img/placeholder.png') }}",
                    is_video: isVideoCall
                });
            } else if (action === 'answer') {
                document.getElementById('callStatus').innerText = "Connecting...";
                socket.emit('receiver_ready', { caller_id: partnerId, target_id: myId });
            }
        }

        socket.on('receiver_ready', async data => {
            if (action === 'call') {
                document.getElementById('callStatus').innerText = "Connecting...";
                setupPeerConnection();
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                socket.emit('webrtc_offer', { target_id: partnerId, caller_id: myId, offer: offer });
            }
        });

        socket.on('webrtc_offer', async data => {
            if (action === 'answer' && data.caller_id === partnerId) {
                setupPeerConnection();
                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                socket.emit('webrtc_answer', { caller_id: partnerId, answer: answer });
                finalizeConnection(); 
            }
        });

        socket.on('call_answered', async data => {
            if (action === 'call') {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                finalizeConnection(); 
            }
        });

        socket.on('new_ice_candidate', async data => {
            if (pc && data.candidate) {
                try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } 
                catch(e) { console.error("ICE Error:", e); }
            }
        });

        // ==========================================
        // 5. CALL TERMINATION
        // ==========================================
        socket.on('call_ended', () => {
            if (isCallConnected) {
                endCall(false);
            } else {
                alert("The other person declined or hung up.");
                window.location.href = '/talk';
            }
        });

        function endCall(notifyOther = true) {
            if (notifyOther) socket.emit('end_call', { target_id: partnerId });
            
            if (pc) pc.close();
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            clearInterval(networkCheckInterval);
            
            window.location.href = '/call-review/' + partnerId; 
        }

        // ==========================================
        // 6. SYSTEM PiP & NETWORK QUALITY
        // ==========================================
        async function toggleSystemPiP() {
            const rv = document.getElementById('remoteVideo');
            try {
                if (document.pictureInPictureElement) await document.exitPictureInPicture();
                else if (document.pictureInPictureEnabled && rv.readyState !== 0) await rv.requestPictureInPicture();
            } catch (error) { alert("Picture-in-Picture is blocked by your browser."); }
        }

        function startNetworkMonitor() {
            networkCheckInterval = setInterval(async () => {
                if (!pc) return;
                try {
                    const stats = await pc.getStats();
                    let packetLoss = 0; let rtt = 0;

                    stats.forEach(report => {
                        if (report.type === 'inbound-rtp' && report.kind === 'video') {
                            const pktsRec = report.packetsReceived || 0;
                            const pktsLost = report.packetsLost || 0;
                            if (pktsRec + pktsLost > 0) packetLoss = (pktsLost / (pktsRec + pktsLost)) * 100;
                        }
                        if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                            rtt = (report.currentRoundTripTime || 0) * 1000;
                        }
                    });

                    const warningEl = document.getElementById('networkWarning');
                    if (pc.iceConnectionState !== 'disconnected' && pc.iceConnectionState !== 'failed') {
                        if (packetLoss > 8 || rtt > 600) {
                            warningEl.style.display = 'block';
                            warningEl.innerText = `⚠️ Weak Signal (Ping: ${Math.round(rtt)}ms)`;
                        } else {
                            warningEl.style.display = 'none';
                        }
                    }
                } catch (e) { }
            }, 2000);
        }

        // ==========================================
        // 7. STUDIO GLOW (BEAUTY FILTER)
        // ==========================================
        let isGlowActive = false;
        function toggleGlow() {
            isGlowActive = !isGlowActive;
            const localVid = document.getElementById('localVideo');
            const glowBtn = document.getElementById('btnGlow');
            
            if (isGlowActive) {
                localVid.classList.add('studio-glow');
                glowBtn.classList.add('active');
            } else {
                localVid.classList.remove('studio-glow');
                glowBtn.classList.remove('active');
            }
        }

        // ==========================================
        // 8. 100 EMOJI SCROLL & LIVE REACTIONS
        // ==========================================
        const reactionEmojis = [
            // Feelings
            '😀','😂','🥺','😭','😡','🤯','😱','🥶','🥵','😎','🥳','😴','🥴','🤢','🤮',
            '🤧','😷','🤫','🤥','🤡','👻','💀','👽','👾','🤖','🎃','😈','👿','👹','👺',
            // Love
            '❤️','🔥','😍','🥰','😘','😗','😙','😚','💌','💘','💝','💖','💗','💓','💞',
            '💕','💟','❣️','💔','❤️‍🔥','❤️‍🩹','💋','💍','💑','💏','💐','🌹','🥀','🌺','🌻',
            // War / Action / Movies
            '💣','💥','⚔️','🗡️','🛡️','🏹','🔫','🧨','🩸','🚁','✈️','🚀','🛸','🛰️','🚨',
            '🥷','🦸‍♂️','🦸‍♀️','🦹‍♂️','🦹‍♀️','🧙‍♂️','🧙‍♀️','🧛‍♂️','🧛‍♀️','🧟‍♂️','🧟‍♀️','🧜‍♂️','🧜‍♀️','🧚‍♂️','🧚‍♀️',
            // Reactions / Misc
            '👍','👎','👏','🙌','👐','🤲','🤝','🙏','✍️','💪','🦾','🦵','🦿','👣','👁️'
        ];

        function populateEmojis() {
            const scrollContainer = document.getElementById('reactionScroll');
            reactionEmojis.forEach(emoji => {
                const btn = document.createElement('button');
                btn.className = 'react-btn';
                btn.innerText = emoji;
                btn.onclick = () => sendReaction(emoji);
                scrollContainer.appendChild(btn);
            });
        }

        function sendReaction(emoji) {
            showFloatingEmoji(emoji, true);
            socket.emit('call_reaction', { target_id: partnerId, emoji: emoji });
        }

        socket.on('receive_reaction', data => {
            showFloatingEmoji(data.emoji, false);
        });

        function showFloatingEmoji(emoji, isLocal) {
            const layer = document.getElementById('reaction-layer');
            const emojiEl = document.createElement('div');
            emojiEl.className = 'floating-emoji';
            emojiEl.innerText = emoji;
            
            const randomX = Math.random() * 40 - 20; 
            
            if (isLocal) {
                emojiEl.style.right = (50 + randomX) + 'px';
            } else {
                emojiEl.style.left = `calc(50% + ${randomX}px)`;
            }

            layer.appendChild(emojiEl);

            setTimeout(() => {
                emojiEl.remove();
            }, 2500);
        }

        // Boot up the system as soon as the page loads
        initWebRTC();
    </script>
</body>
</html>
