<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Call | Find Your Match</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* === NATIVE FULLSCREEN APP UI === */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #0B1219; color: white; font-family: 'Outfit', sans-serif; 
            overflow: hidden; height: 100vh; height: 100dvh; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; 
            user-select: none;
        }
        
        /* === DYNAMIC VIDEO SWAP LAYERS === */
        .video-container { position: absolute; inset: 0; z-index: 1; display: none; background: #000; }
        
        /* The video filling the screen */
        .video-main {
            position: absolute; inset: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: 1; transition: 0.3s ease-in-out;
        }
        
        /* The floating small video in the corner */
        .video-pip {
            position: absolute; bottom: 130px; right: 20px; 
            width: 110px; height: 160px; object-fit: cover; 
            border-radius: 16px; border: 2px solid rgba(255,255,255,0.8); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); 
            z-index: 5; background: #111; cursor: pointer;
            transition: 0.3s ease-in-out;
        }
        .video-pip:hover { transform: scale(1.05); }
        .mirrored { transform: scaleX(-1) !important; }
        .pip-hover:hover { transform: scale(1.05) scaleX(-1) !important; }
        
        /* === VOICE AVATAR LAYERS === */
        .avatar-container { z-index: 2; text-align: center; margin-bottom: 30px; transition: 0.3s; }
        
        .avatar { 
            width: 150px; height: 150px; border-radius: 50%; object-fit: cover; 
            border: 4px solid #38bdf8; margin-bottom: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .avatar.ringing {
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 
            0% { box-shadow: 0 0 0 0 rgba(56,189,248,0.7); } 
            70% { box-shadow: 0 0 0 35px rgba(56,189,248,0); } 
            100% { box-shadow: 0 0 0 0 rgba(56,189,248,0); } 
        }
        
        h1 { margin: 0 0 8px 0; font-size: 28px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .status { color: #38bdf8; font-size: 16px; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,0.8); letter-spacing: 0.5px; }
        .timer { 
            margin-top: 6px; font-size: 14px; font-weight: 600; color: #a5f3fc; 
            background: rgba(15,23,42,0.6); padding: 4px 12px; border-radius: 20px; 
            border: 1px solid rgba(56,189,248,0.3); display: inline-block;
        }

        /* === BANNERS & NOTIFICATIONS === */
        .top-banner {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            padding: 8px 18px; border-radius: 25px; font-size: 13px; font-weight: 700; 
            z-index: 25; display: none; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { transform: translate(-50%, -20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        .banner-warning { background: rgba(239, 68, 68, 0.95); color: white; }
        .banner-toast { background: rgba(15, 23, 42, 0.9); color: #38bdf8; border: 1px solid #38bdf8; }
        .banner-audio-prompt { 
            background: #0284c7; color: white; cursor: pointer; display: none; 
            box-shadow: 0 0 20px rgba(2, 132, 199, 0.6);
        }

        /* === CONTROLS BAR === */
        .controls-wrapper {
            position: absolute; bottom: 35px; z-index: 15; 
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .controls { 
            display: flex; align-items: center; gap: 15px; 
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px);
            padding: 10px 20px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .btn { 
            width: 56px; height: 56px; border-radius: 50%; border: none; 
            cursor: pointer; font-size: 22px; display: flex; align-items: center; 
            justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }
        .btn:active { transform: scale(0.9); }
        
        .btn-ctrl { background: #1E293B; color: #F1F5F9; border: 1px solid #334155; }
        .btn-ctrl:hover { background: #334155; }
        .btn-ctrl.muted { background: #ef4444; color: white; border-color: #dc2626; }
        
        .btn-hangup { background: #ef4444; color: white; width: 62px; height: 62px; font-size: 26px; }
        .btn-hangup:hover { background: #dc2626; transform: scale(1.05); }

        .btn-magic { background: #1E293B; color: #A855F7; border: 1px solid #334155; }
        .btn-magic.active { background: rgba(168, 85, 247, 0.25); border-color: #A855F7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.5); }

        /* === STUDIO GLOW FILTER === */
        .studio-glow {
            filter: brightness(1.1) contrast(1.05) saturate(1.2) sepia(0.08);
        }

        /* === SCROLLABLE 100-EMOJI REACTIONS UI === */
        .reaction-bar-container {
            position: absolute; right: 15px; top: 40%; transform: translateY(-50%);
            height: 50vh; width: 55px; z-index: 20; border-radius: 28px;
            background: rgba(11, 18, 25, 0.6); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1); display: none; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .reaction-scroll {
            height: 100%; overflow-y: auto; display: flex; flex-direction: column;
            align-items: center; gap: 14px; padding: 12px 0;
            -ms-overflow-style: none; scrollbar-width: none; 
        }
        .reaction-scroll::-webkit-scrollbar { display: none; }
        
        .react-btn {
            background: none; border: none; font-size: 26px; cursor: pointer;
            transition: 0.2s; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .react-btn:active { transform: scale(0.6); }
        .react-btn:hover { transform: scale(1.2); }

        /* Floating Emoji Animation Container */
        #reaction-layer {
            position: absolute; inset: 0; z-index: 15; pointer-events: none; overflow: hidden;
        }
        .floating-emoji {
            position: absolute; bottom: -50px; font-size: 50px;
            animation: floatUpAndFade 2.5s ease-out forwards;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }

        @keyframes floatUpAndFade {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            10% { transform: translateY(-50px) scale(1.2); opacity: 1; }
            50% { transform: translateY(-200px) scale(1) translateX(15px); opacity: 1; }
            100% { transform: translateY(-400px) scale(1.5) translateX(-20px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="top-banner banner-warning" id="networkWarning">⚠️ Weak Connection</div>
    <div class="top-banner banner-toast" id="toastNotice">Notification</div>
    <div class="top-banner banner-audio-prompt" id="audioPrompt" onclick="unlockAudio()">🔊 Tap to Enable Audio</div>

    <div id="reaction-layer"></div>

    <div class="reaction-bar-container" id="reactionBar">
        <div class="reaction-scroll" id="reactionScroll"></div>
    </div>

    <div class="video-container" id="videoContainer">
        <video id="remoteVideo" class="video-main" autoplay playsinline onclick="handleVideoClick('remote')"></video>
        <video id="localVideo" class="video-pip mirrored pip-hover" autoplay playsinline muted onclick="handleVideoClick('local')"></video>
    </div>
    
    <div class="avatar-container" id="avatarContainer">
        <img src="{{ partner_img }}" class="avatar ringing" id="partnerAvatar" alt="{{ partner_name }}">
        <h1>{{ partner_name }}</h1>
        <div class="status" id="callStatus">Connecting...</div>
        <div class="timer" id="callTimer" style="display: none;">00:00</div>
    </div>

    <div class="controls-wrapper">
        <div class="controls">
            <!-- Mic Mute Toggle -->
            <button class="btn btn-ctrl" id="btnMic" onclick="toggleMute()" title="Mute Microphone">🎙️</button>
            
            <!-- Video Toggle (Video Calls only) -->
            <button class="btn btn-ctrl" id="btnVideo" onclick="toggleVideo()" title="Turn Camera Off" style="display: none;">📹</button>
            
            <!-- Camera Flip (Video Calls only) -->
            <button class="btn btn-ctrl" id="btnFlip" onclick="switchCamera()" title="Switch Camera" style="display: none;">🔄</button>
            
            <!-- Studio Glow (Video Calls only) -->
            <button class="btn btn-magic" id="btnGlow" onclick="toggleGlow()" title="Studio Beauty Glow" style="display: none;">✨</button>
            
            <!-- PiP Button -->
            <button class="btn btn-ctrl" id="btnPipSys" onclick="toggleSystemPiP()" style="display: none;" title="Minimize Window">⧉</button>
            
            <!-- Hangup Button -->
            <button class="btn btn-hangup" onclick="endCall(true)" title="End Call">📵</button>
        </div>
    </div>

    <!-- Hidden Remote Audio Receiver -->
    <audio id="remoteAudio" autoplay playsinline></audio>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        // ==========================================
        // 1. FIREBASE & CORE PARAMETERS
        // ==========================================
        const firebaseConfig = {
            apiKey: "{{ firebase_api_key }}",
            authDomain: "mmust-dating-site.firebaseapp.com",
            databaseURL: "{{ firebase_db_url or 'https://mmust-dating-site-default-rtdb.firebaseio.com' }}",
            projectId: "mmust-dating-site",
            storageBucket: "mmust-dating-site.firebasestorage.app",
            messagingSenderId: "572096461211",
            appId: "1:572096461211:web:e38b542343ac8e4eca893e"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const fdb = firebase.database();
        
        const myId = "{{ session.get('user_id') }}";
        const partnerId = "{{ partner_id }}";
        const action = "{{ action }}"; 
        const isVideoCall = {{ is_video | lower }};
        const roomId = `call_${[myId, partnerId].sort().join('_')}`;
        const callsRef = fdb.ref(`calls/${roomId}`);
        
        let pc = null;
        let localStream = null;
        let networkCheckInterval = null;
        let isCallConnected = false;
        let localIsPip = true; 
        let pendingIceCandidates = [];
        let callTimeoutId = null;

        // UI Controls State
        let isMicMuted = false;
        let isVideoMuted = false;
        let currentFacingMode = 'user';
        let isGlowActive = false;

        // Timer
        let callTimerInterval = null;
        let callDurationSec = 0;
        
        let rtcConfig = { 
            iceServers: [
                { urls: [
                    'stun:stun.l.google.com:19302',
                    'stun:stun1.l.google.com:19302',
                    'stun:stun2.l.google.com:19302',
                    'stun:stun3.l.google.com:19302',
                    'stun:stun4.l.google.com:19302'
                ]},
                { urls: 'stun:stun.cloudflare.com:3478' }
            ] 
        };

        window.addEventListener('beforeunload', () => endCall(true));

        // ==========================================
        // 2. SYNTHESIZED SOUND ENGINE (ZERO 404, ZERO LAG)
        // ==========================================
        let outgoingRingCtx = null;
        let outgoingRingInterval = null;

        function playOutgoingRing(start) {
            if (!start) {
                if (outgoingRingInterval) {
                    clearInterval(outgoingRingInterval);
                    outgoingRingInterval = null;
                }
                if (outgoingRingCtx) {
                    try { outgoingRingCtx.close(); } catch(e){}
                    outgoingRingCtx = null;
                }
                return;
            }
            if (outgoingRingInterval) return;

            const ringBurst = () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    outgoingRingCtx = ctx;
                    if (ctx.state === 'suspended') ctx.resume();

                    const osc1 = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc1.type = 'sine'; osc2.type = 'sine';
                    osc1.frequency.setValueAtTime(440, ctx.currentTime);
                    osc2.frequency.setValueAtTime(480, ctx.currentTime);

                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.1);
                    gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 1.8);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 2.0);

                    osc1.connect(gain); osc2.connect(gain);
                    gain.connect(ctx.destination);

                    osc1.start(); osc2.start();
                    osc1.stop(ctx.currentTime + 2.0);
                    osc2.stop(ctx.currentTime + 2.0);
                } catch(e) {}
            };

            ringBurst();
            outgoingRingInterval = setInterval(ringBurst, 4000);
        }

        function playConnectedChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15); // E5
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.3); // G5
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.5);
            } catch(e) {}
        }

        function playEndedChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(200, ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.4);
            } catch(e) {}
        }

        function unlockAudio() {
            const ra = document.getElementById('remoteAudio');
            const rv = document.getElementById('remoteVideo');
            if (ra) ra.play().catch(() => {});
            if (rv) rv.play().catch(() => {});
            document.getElementById('audioPrompt').style.display = 'none';
        }

        function showToastNotice(msg) {
            const t = document.getElementById('toastNotice');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2500);
        }

        // ==========================================
        // 3. WHATSAPP-STYLE VIDEO SWAP
        // ==========================================
        function handleVideoClick(clickedType) {
            const localVid = document.getElementById('localVideo');
            const remoteVid = document.getElementById('remoteVideo');

            if (clickedType === 'local' && localIsPip) {
                localVid.className = 'video-main mirrored';
                remoteVid.className = 'video-pip pip-hover';
                localIsPip = false;
            } else if (clickedType === 'remote' && !localIsPip) {
                remoteVid.className = 'video-main';
                localVid.className = 'video-pip mirrored pip-hover';
                localIsPip = true;
            }
        }

        // ==========================================
        // 4. WEBRTC PEER CONNECTION SETUP
        // ==========================================
        function setupPeerConnection() {
            pc = new RTCPeerConnection(rtcConfig);
            
            // Add local tracks to connection
            if (localStream) {
                localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            }

            // Stream Receiver (Unified Plan: handles audio and video tracks)
            pc.ontrack = e => {
                const stream = e.streams && e.streams[0] ? e.streams[0] : new MediaStream([e.track]);
                
                // Route to remote audio
                const ra = document.getElementById('remoteAudio');
                if (ra && ra.srcObject !== stream) {
                    ra.srcObject = stream;
                    ra.play().catch(() => {
                        document.getElementById('audioPrompt').style.display = 'block';
                    });
                }

                // If video call, route to remote video
                if (isVideoCall) {
                    const rv = document.getElementById('remoteVideo');
                    if (rv && rv.srcObject !== stream) {
                        rv.srcObject = stream;
                        rv.play().catch(() => {
                            document.getElementById('audioPrompt').style.display = 'block';
                        });
                    }
                    document.getElementById('avatarContainer').style.display = 'none';
                    if (document.pictureInPictureEnabled) {
                        document.getElementById('btnPipSys').style.display = 'flex';
                    }
                }
            };

            // Send local ICE candidates to Firebase
            pc.onicecandidate = e => {
                if (e.candidate) {
                    callsRef.child(`candidates_${myId}`).push(e.candidate.toJSON());
                }
            };

            pc.oniceconnectionstatechange = () => {
                const warningEl = document.getElementById('networkWarning');
                if (pc.iceConnectionState === 'disconnected') {
                    warningEl.style.display = 'block';
                    warningEl.innerText = "⚠️ Weak signal, reconnecting...";
                } else if (pc.iceConnectionState === 'connected') {
                    warningEl.style.display = 'none';
                } else if (pc.iceConnectionState === 'failed') {
                    warningEl.style.display = 'block';
                    warningEl.innerText = "❌ Connection Lost";
                    setTimeout(() => endCall(false), 3000);
                }
            };

            // Listen for Remote ICE Candidates with instant flush
            callsRef.child(`candidates_${partnerId}`).on('child_added', snapshot => {
                const candidateData = snapshot.val();
                if (!candidateData) return;
                const candidate = new RTCIceCandidate(candidateData);
                
                if (pc && pc.remoteDescription && pc.remoteDescription.type) {
                    pc.addIceCandidate(candidate).catch(e => console.warn("ICE Candidate notice:", e));
                } else {
                    pendingIceCandidates.push(candidate);
                }
            });
        }

        function drainPendingIceCandidates() {
            while (pendingIceCandidates.length > 0) {
                const cand = pendingIceCandidates.shift();
                if (pc && pc.remoteDescription) {
                    pc.addIceCandidate(cand).catch(e => console.warn("Drain ICE notice:", e));
                }
            }
        }

        function finalizeConnection() {
            if (isCallConnected) return;
            isCallConnected = true;
            if (callTimeoutId) clearTimeout(callTimeoutId);
            playOutgoingRing(false);
            playConnectedChime();

            document.getElementById('callStatus').innerText = "Connected 🟢";
            document.getElementById('partnerAvatar').classList.remove('ringing');
            
            // Show Live Call Timer
            startCallTimer();

            // Enable video reactions bar
            if (isVideoCall) {
                document.getElementById('reactionBar').style.display = 'block';
            }
            startNetworkMonitor();
        }

        function startCallTimer() {
            callDurationSec = 0;
            const timerEl = document.getElementById('callTimer');
            timerEl.style.display = 'inline-block';
            if (callTimerInterval) clearInterval(callTimerInterval);
            callTimerInterval = setInterval(() => {
                callDurationSec++;
                const mins = String(Math.floor(callDurationSec / 60)).padStart(2, '0');
                const secs = String(callDurationSec % 60).padStart(2, '0');
                timerEl.innerText = `${mins}:${secs}`;
            }, 1000);
        }

        // ==========================================
        // 5. MASTER HANDSHAKE FLOW
        // ==========================================
        async function initWebRTC() {
            populateEmojis();

            // Show video-specific control buttons if in video mode
            if (isVideoCall) {
                document.getElementById('btnVideo').style.display = 'flex';
                document.getElementById('btnFlip').style.display = 'flex';
                document.getElementById('btnGlow').style.display = 'flex';
            }

            // Fetch high-speed ICE/TURN configuration
            try {
                const res = await fetch('/api/turn-credentials');
                const data = await res.json();
                if (data.iceServers && data.iceServers.length > 0) {
                    rtcConfig.iceServers = data.iceServers;
                }
            } catch(e) {
                console.warn("Using built-in STUN network routing.");
            }

            // Acquire User Media (Microphone & Optional Camera)
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, 
                    video: isVideoCall ? { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } } : false 
                });
                
                if (isVideoCall) {
                    document.getElementById('videoContainer').style.display = 'block';
                    document.getElementById('localVideo').srcObject = localStream;
                }
            } catch (e) {
                console.error("Media permission error:", e);
                alert("Microphone/Camera permission is required to make calls. Please allow permissions in your browser settings.");
                window.location.href = '/talk';
                return;
            }

            if (action === 'call') {
                document.getElementById('callStatus').innerText = "Ringing... 🔔";
                playOutgoingRing(true);

                // Clear previous session node
                await callsRef.remove();
                
                // Ring timeout (45 seconds)
                callTimeoutId = setTimeout(() => {
                    if (!isCallConnected) {
                        playOutgoingRing(false);
                        playEndedChime();
                        document.getElementById('callStatus').innerText = "No Answer 📵";
                        setTimeout(() => endCall(true), 2500);
                    }
                }, 45000);

                // 1. Client Firebase push
                const callPayload = {
                    caller_id: myId,
                    caller_name: "{{ session.get('user_name', 'Student').split()[0] }}",
                    caller_img: "{{ session.get('profile_img', '/static/img/placeholder.png') }}",
                    is_video: isVideoCall,
                    timestamp: Date.now()
                };
                fdb.ref(`incoming_calls/${partnerId}`).push(callPayload);

                // 2. Dual server-side trigger fallback
                fetch('/api/call/ring', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ partner_id: partnerId, is_video: isVideoCall })
                }).catch(e => console.warn("Server ring notice:", e));

                setupPeerConnection();

                // Caller waits for receiver to confirm ready
                callsRef.child('receiver_ready').on('value', async snap => {
                    if (snap.val() === true && pc && !pc.currentLocalDescription) {
                        document.getElementById('callStatus').innerText = "Connecting... 🔄";
                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);
                        callsRef.child('offer').set({ type: offer.type, sdp: offer.sdp });
                    }
                });

                // Caller waits for receiver's answer
                callsRef.child('answer').on('value', async snap => {
                    const answer = snap.val();
                    if (answer && pc && !pc.currentRemoteDescription) {
                        await pc.setRemoteDescription(new RTCSessionDescription(answer));
                        drainPendingIceCandidates();
                        finalizeConnection();
                    }
                });

            } else if (action === 'answer') {
                document.getElementById('callStatus').innerText = "Connecting... 🔄";
                setupPeerConnection();
                
                // Notify caller we are ready for their offer
                callsRef.child('receiver_ready').set(true);

                // Receiver waits for caller's offer
                callsRef.child('offer').on('value', async snap => {
                    const offer = snap.val();
                    if (offer && pc && !pc.currentRemoteDescription) {
                        await pc.setRemoteDescription(new RTCSessionDescription(offer));
                        drainPendingIceCandidates();
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        callsRef.child('answer').set({ type: answer.type, sdp: answer.sdp });
                        finalizeConnection();
                    }
                });
            }
            
            // Listen for Call Termination or Decline from room
            callsRef.child('ended').on('value', snap => {
                if (snap.val() === true) {
                    endCall(false);
                }
            });

            callsRef.child('status').on('value', snap => {
                if (snap.val() === 'declined') {
                    playOutgoingRing(false);
                    playEndedChime();
                    document.getElementById('callStatus').innerText = "Call Declined 📵";
                    setTimeout(() => endCall(false), 2000);
                }
            });

            // Also listen to personal signal queue for end_call
            fdb.ref(`signals/${myId}`).on('child_added', snap => {
                const data = snap.val();
                if (data && (data.type === 'end_call' || data.type === 'call_ended')) {
                    snap.ref.remove();
                    if (data.reason === 'declined') {
                        playOutgoingRing(false);
                        playEndedChime();
                        document.getElementById('callStatus').innerText = "Call Declined 📵";
                        setTimeout(() => endCall(false), 2000);
                    } else {
                        endCall(false);
                    }
                }
            });
            
            // Listen for Live Reactions
            callsRef.child('reactions').on('child_added', snap => {
                const data = snap.val();
                if (data && data.sender !== myId) {
                    showFloatingEmoji(data.emoji, false);
                }
            });
        }

        // ==========================================
        // 6. CALL CONTROLS (MIC, VIDEO, CAM-FLIP)
        // ==========================================
        function toggleMute() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (!audioTrack) return;
            
            isMicMuted = !isMicMuted;
            audioTrack.enabled = !isMicMuted;
            
            const btn = document.getElementById('btnMic');
            if (isMicMuted) {
                btn.innerHTML = '🔇';
                btn.classList.add('muted');
                showToastNotice("Microphone Muted");
            } else {
                btn.innerHTML = '🎙️';
                btn.classList.remove('muted');
                showToastNotice("Microphone Active");
            }
        }

        function toggleVideo() {
            if (!localStream || !isVideoCall) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (!videoTrack) return;
            
            isVideoMuted = !isVideoMuted;
            videoTrack.enabled = !isVideoMuted;
            
            const btn = document.getElementById('btnVideo');
            if (isVideoMuted) {
                btn.innerHTML = '🚫';
                btn.classList.add('muted');
                showToastNotice("Camera Off");
            } else {
                btn.innerHTML = '📹';
                btn.classList.remove('muted');
                showToastNotice("Camera On");
            }
        }

        async function switchCamera() {
            if (!localStream || !isVideoCall) return;
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            
            try {
                const newStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: { facingMode: currentFacingMode }
                });
                const newVideoTrack = newStream.getVideoTracks()[0];
                const oldVideoTrack = localStream.getVideoTracks()[0];
                
                if (pc) {
                    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) sender.replaceTrack(newVideoTrack);
                }
                
                localStream.removeTrack(oldVideoTrack);
                oldVideoTrack.stop();
                localStream.addTrack(newVideoTrack);
                document.getElementById('localVideo').srcObject = localStream;
                showToastNotice("Camera Switched");
            } catch(err) {
                console.warn("Could not switch camera:", err);
                showToastNotice("Only 1 camera detected");
            }
        }

        // ==========================================
        // 7. CALL TERMINATION
        // ==========================================
        function endCall(notifyOther = true) {
            playOutgoingRing(false);
            if (callTimeoutId) clearTimeout(callTimeoutId);
            if (callTimerInterval) clearInterval(callTimerInterval);
            
            if (notifyOther) {
                callsRef.child('ended').set(true);
                fdb.ref(`signals/${partnerId}`).push({ type: 'end_call' });
            }
            
            if (pc) {
                try { pc.close(); } catch(e){}
                pc = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            clearInterval(networkCheckInterval);
            
            if (!isCallConnected && notifyOther) {
                playEndedChime();
                showToastNotice("Call ended");
                setTimeout(() => { window.location.href = '/talk'; }, 800);
            } else {
                playEndedChime();
                window.location.href = '/call-review/' + partnerId; 
            }
        }

        // ==========================================
        // 8. SYSTEM PiP & NETWORK QUALITY
        // ==========================================
        async function toggleSystemPiP() {
            const rv = document.getElementById('remoteVideo');
            try {
                if (document.pictureInPictureElement) await document.exitPictureInPicture();
                else if (document.pictureInPictureEnabled && rv.readyState !== 0) await rv.requestPictureInPicture();
            } catch (error) { 
                showToastNotice("PiP unavailable in this browser"); 
            }
        }

        function startNetworkMonitor() {
            networkCheckInterval = setInterval(async () => {
                if (!pc) return;
                try {
                    const stats = await pc.getStats();
                    let packetLoss = 0; let rtt = 0;

                    stats.forEach(report => {
                        if (report.type === 'inbound-rtp' && report.kind === 'video') {
                            const pktsRec = report.packetsReceived || 0;
                            const pktsLost = report.packetsLost || 0;
                            if (pktsRec + pktsLost > 0) packetLoss = (pktsLost / (pktsRec + pktsLost)) * 100;
                        }
                        if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                            rtt = (report.currentRoundTripTime || 0) * 1000;
                        }
                    });

                    const warningEl = document.getElementById('networkWarning');
                    if (pc.iceConnectionState !== 'disconnected' && pc.iceConnectionState !== 'failed') {
                        if (packetLoss > 8 || rtt > 600) {
                            warningEl.style.display = 'block';
                            warningEl.innerText = `⚠️ Weak Signal (Ping: ${Math.round(rtt)}ms)`;
                        } else {
                            warningEl.style.display = 'none';
                        }
                    }
                } catch (e) { }
            }, 2000);
        }

        // ==========================================
        // 9. STUDIO GLOW (BEAUTY FILTER)
        // ==========================================
        function toggleGlow() {
            isGlowActive = !isGlowActive;
            const localVid = document.getElementById('localVideo');
            const glowBtn = document.getElementById('btnGlow');
            
            if (isGlowActive) {
                localVid.classList.add('studio-glow');
                glowBtn.classList.add('active');
                showToastNotice("Studio Glow: ON ✨");
            } else {
                localVid.classList.remove('studio-glow');
                glowBtn.classList.remove('active');
                showToastNotice("Studio Glow: OFF");
            }
        }

        // ==========================================
        // 10. EMOJI SCROLL & LIVE REACTIONS
        // ==========================================
        const reactionEmojis = [
            '😀','😂','🥺','😭','😡','🤯','😱','🥶','🥵','😎','🥳','😴','🥴','🤢','🤮',
            '🤧','😷','🤫','🤥','🤡','👻','💀','👽','👾','🤖','🎃','😈','👿','👹','👺',
            '❤️','🔥','😍','🥰','😘','😗','😙','😚','💌','💘','💝','💖','💗','💓','💞',
            '💕','💟','❣️','💔','❤️‍🔥','❤️‍🩹','💋','💍','💑','💏','💐','🌹','🥀','🌺','🌻',
            '💣','💥','⚔️','🗡️','🛡️','🏹','🔫','🧨','🩸','🚁','✈️','🚀','🛸','🛰️','🚨',
            '🥷','🦸‍♂️','🦸‍♀️','🦹‍♂️','🦹‍♀️','🧙‍♂️','🧙‍♀️','🧛‍♂️','🧛‍♀️','🧟‍♂️','🧟‍♀️','🧜‍♂️','🧜‍♀️','🧚‍♂️','🧚‍♀️',
            '👍','👎','👏','🙌','👐','🤲','🤝','🙏','✍️','💪','🦾','🦵','🦿','👣','👁️'
        ];

        function populateEmojis() {
            const scrollContainer = document.getElementById('reactionScroll');
            reactionEmojis.forEach(emoji => {
                const btn = document.createElement('button');
                btn.className = 'react-btn';
                btn.innerText = emoji;
                btn.onclick = () => sendReaction(emoji);
                scrollContainer.appendChild(btn);
            });
        }

        function sendReaction(emoji) {
            showFloatingEmoji(emoji, true);
            callsRef.child('reactions').push({ emoji: emoji, sender: myId });
        }

        function showFloatingEmoji(emoji, isLocal) {
            const layer = document.getElementById('reaction-layer');
            const emojiEl = document.createElement('div');
            emojiEl.className = 'floating-emoji';
            emojiEl.innerText = emoji;
            
            const randomX = Math.random() * 40 - 20; 
            if (isLocal) {
                emojiEl.style.right = (50 + randomX) + 'px';
            } else {
                emojiEl.style.left = `calc(50% + ${randomX}px)`;
            }

            layer.appendChild(emojiEl);
            setTimeout(() => { emojiEl.remove(); }, 2500);
        }

        // Initialize Call Engine
        initWebRTC();
    </script>
</body>
