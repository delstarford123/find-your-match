{% extends "base.html" %}

{% block content %}
<style>
    /* === LAYOUT === */
    .verification-wrapper {
        min-height: calc(100dvh - var(--nav-height, 70px) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(20px, 5vw, 40px) 15px;
        /* Subtle background transition based on status */
        background-color: {% if status == 'VERIFIED' %} rgba(16, 185, 129, 0.08) {% else %} rgba(239, 68, 68, 0.08) {% endif %};
        transition: background-color 0.5s ease;
    }

    .status-card {
        width: 100%;
        max-width: 420px;
        text-align: center;
        padding: clamp(35px, 8vw, 55px) clamp(20px, 5vw, 30px);
        border-radius: 36px;
        background: white;
        transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.12);
        border: 8px solid {{ color }};
        /* Starts slightly lower for the slide-up animation */
        transform: translateY(30px);
        opacity: 0;
        box-sizing: border-box;
    }

    /* === PREMIUM SUCCESS ANIMATION === */
    @keyframes slideUpFade {
        to { transform: translateY(0); opacity: 1; }
    }

    @keyframes pulse-bg {
        0% { transform: scale(1); box-shadow: 0 15px 40px rgba(16, 185, 129, 0.2); }
        50% { transform: scale(1.03); box-shadow: 0 25px 60px rgba(16, 185, 129, 0.4); }
        100% { transform: scale(1); box-shadow: 0 15px 40px rgba(16, 185, 129, 0.2); }
    }
    
    @keyframes pulse-fail {
        0% { transform: scale(1); box-shadow: 0 15px 40px rgba(239, 68, 68, 0.2); }
        50% { transform: scale(1.03); box-shadow: 0 25px 60px rgba(239, 68, 68, 0.4); }
        100% { transform: scale(1); box-shadow: 0 15px 40px rgba(239, 68, 68, 0.2); }
    }

    .status-card-verified { 
        animation: slideUpFade 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, pulse-bg 2s 0.6s infinite ease-in-out; 
    }
    .status-card-failed {
        animation: slideUpFade 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, pulse-fail 2s 0.6s infinite ease-in-out;
    }

    /* === TYPOGRAPHY & ELEMENTS === */
    .status-icon {
        font-size: clamp(90px, 25vw, 130px); 
        margin-bottom: 10px;
        line-height: 1;
        /* Dropshadow on the emoji makes it pop */
        filter: drop-shadow(0 15px 20px rgba(0,0,0,0.15));
    }

    .status-title {
        color: {{ color }}; 
        font-size: clamp(38px, 10vw, 52px); 
        font-weight: 900; 
        margin: 0 0 15px 0; 
        letter-spacing: -1px;
        line-height: 1.1;
    }
    
    .status-message {
        color: #4A0008; 
        font-size: clamp(16px, 4vw, 20px); 
        font-weight: 700; 
        line-height: 1.5; 
        margin: 0 0 35px 0; 
        padding: 0 15px;
    }
    
    /* === REDEMPTION BOX === */
    .redemption-box {
        background: #f8fafc; 
        padding: 25px 20px; 
        border-radius: 24px; 
        margin-bottom: 40px; 
        border: 2px dashed #e2e8f0;
    }
    
    .redemption-label {
        font-size: 12px; 
        color: #64748b; 
        text-transform: uppercase; 
        letter-spacing: 1.5px; 
        font-weight: 900; 
        margin: 0 0 8px 0;
    }
    
    .redemption-venue {
        font-size: clamp(22px, 6vw, 28px); 
        color: #720000; 
        font-weight: 900; 
        margin: 0;
        line-height: 1.2;
        letter-spacing: -0.5px;
    }

    /* === BUTTON === */
    .btn-return {
        display: flex; justify-content: center; align-items: center; gap: 10px;
        width: 100%; padding: 20px; border-radius: 18px; 
        font-weight: 900; text-decoration: none; font-size: 16px; 
        background: {{ color }}; color: white; border: none;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        box-sizing: border-box; min-height: 60px; /* Large touch target */
    }
    
    .btn-return:active { transform: scale(0.96); }
    
    @media (hover: hover) {
        .btn-return:hover {
            filter: brightness(0.95);
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
    }
</style>

<div class="verification-wrapper">
    <div class="status-card {% if status == 'VERIFIED' %}status-card-verified{% else %}status-card-failed{% endif %}">
        
        <div id="status-icon" class="status-icon">
            {% if status == 'VERIFIED' %} ✅ {% else %} ❌ {% endif %}
        </div>

        <h1 class="status-title">
            {{ status }}
        </h1>
        
        <p class="status-message">
            {{ message }}
        </p>
        
        <div class="redemption-box">
            <p class="redemption-label">Redeeming At</p>
            <p class="redemption-venue">{{ restaurant_name }}</p>
        </div>

        <a href="{{ url_for('dashboard') }}" class="btn-return">
            Return to Dashboard
        </a>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const status = "{{ status }}";
        
        // Chime URLs (Mixkit UI SFX)
        const successSound = "https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"; 
        const failureSound = "https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3";

        // Initialize and play audio
        const audio = new Audio(status === "VERIFIED" ? successSound : failureSound);
        audio.volume = 0.6;

        // Trigger Haptics on Mobile (if supported)
        if (navigator.vibrate) {
            if (status === "VERIFIED") {
                // Success: Two quick happy buzzes
                navigator.vibrate([100, 50, 100]);
            } else {
                // Failure: One long, heavy buzz
                navigator.vibrate(400);
            }
        }

        // Small delay to allow the visual page to render first
        setTimeout(() => {
            audio.play().catch(err => {
                // Browsers block auto-play unless there is prior user interaction on the domain
                console.log("Audio play deferred until user interaction.");
            });
        }, 400);
    });
</script>
{% endblock %}
