{% extends "base.html" %}

{% block content %}
<style>
    /* Force hide the global footer, mobile nav, and support button from base.html on this page only */
    footer,
    .footer-bottom,
    .bottom-nav,
    .mobile-bottom-nav,
    .support-trigger-btn {
        display: none !important;
    }
    
    /* Seamless Immersion: Make navbar glassmorphic instead of solid red */
    nav.navbar {
        background: rgba(0, 0, 0, 0.4) !important;
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
    }

    /* We remove the body override so it acts like a normal page, just like group_chat.html */

    .club-wrapper {
        position: relative;
        width: 100%;
        max-width: 1200px;
        height: 85vh;
        margin: 20px auto;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border: 1px solid rgba(255, 0, 255, 0.3);
    }

    /* Background Video Optimization */
    .club-bg-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(0.3) blur(3px);
        z-index: 0;
    }

    .video-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.9) 100%);
        z-index: 1;
    }

    /* Core Layout */
    .party-content {
        position: relative;
        z-index: 2;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 20px;
        box-sizing: border-box;
    }

    .party-header {
        flex-shrink: 0;
        text-align: center;
        margin-bottom: 15px;
    }

    .neon-title {
        color: #fff;
        font-size: clamp(1.8rem, 5vw, 3rem);
        font-weight: 900;
        text-shadow: 0 0 10px #f0f, 0 0 20px #f0f, 0 0 40px #0ff;
        margin: 0 0 5px;
        font-family: 'Black Ops One', cursive, system-ui;
        letter-spacing: 2px;
    }

    .party-stats {
        color: #0ff;
        font-weight: 800;
        letter-spacing: 2px;
        font-size: clamp(0.7rem, 3vw, 1rem);
        text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 20px #0ff;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    
    .pulse-dot-green {
        width: 10px;
        height: 10px;
        background-color: #22c55e;
        border-radius: 50%;
        box-shadow: 0 0 8px #22c55e;
        animation: pulseGreen 1.5s infinite;
    }
    
    @keyframes pulseGreen {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .main-party-layout {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 350px;
        gap: 20px;
        min-height: 0;
        /* Critical for flex/grid children overflow to work */
    }

    /* Avatars Arena */
    .avatar-arena {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        align-content: start;
        gap: 15px;
        padding: 20px;
        overflow-y: auto;
        /* Custom scrollbar for desktop */
        scrollbar-width: thin;
        scrollbar-color: #f0f transparent;
    }

    .avatar-arena::-webkit-scrollbar {
        width: 6px;
    }

    .avatar-arena::-webkit-scrollbar-thumb {
        background: #f0f;
        border-radius: 10px;
    }

    .avatar-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        animation: floatAvatar 3s ease-in-out infinite alternate;
    }

    .avatar-item:nth-child(even) { animation-delay: 1.2s; animation-duration: 4s; }
    .avatar-item:nth-child(3n) { animation-delay: 0.5s; animation-duration: 3.5s; }

    @keyframes floatAvatar {
        from { transform: translateY(0px) rotate(0deg); }
        to { transform: translateY(-8px) rotate(2deg); }
    }

    .avatar-item:hover,
    .avatar-item:active {
        animation-play-state: paused;
        transform: scale(1.1) rotate(5deg);
    }

    .avatar-img-wrap {
        width: 65px;
        height: 65px;
        border: 2px solid #f0f;
        box-shadow: 0 0 10px rgba(255, 0, 255, 0.4);
        overflow: hidden;
        background: #222;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .avatar-img-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .avatar-name {
        margin-top: 8px;
        font-size: 11px;
        font-weight: 800;
        color: #fff;
        text-shadow: 1px 1px 3px #000;
        text-align: center;
        width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* CSS Shapes */
    .shape-1 {
        border-radius: 50%;
    }

    .shape-2 {
        border-radius: 15% 50% 15% 50%;
    }

    .shape-3 {
        border-radius: 50% 15% 50% 15%;
    }

    .shape-4 {
        border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
    }

    .shape-5 {
        border-radius: 50% 50% 50% 0%;
    }

    .shape-6 {
        border-radius: 0% 50% 50% 50%;
    }

    .shape-7 {
        border-radius: 25%;
        transform: rotate(45deg);
    }

    .shape-7 img {
        transform: rotate(-45deg);
        scale: 1.3;
    }

    /* Scale prevents white corners */
    .shape-8 {
        border-radius: 50% 50% 0 0;
    }

    /* Chat Panel */
    .party-chat-panel {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: all 0.3s ease;
    }
    
    .party-chat-panel.whisper-active {
        background: rgba(147, 51, 234, 0.15); /* Deep purple glow */
        border-color: rgba(168, 85, 247, 0.4);
        box-shadow: 0 0 20px rgba(147, 51, 234, 0.3) inset;
    }

    .chat-header {
        padding: 12px 15px;
        border-bottom: 1px solid rgba(255, 0, 255, 0.2);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 0, 0, 0.8);
        flex-shrink: 0;
    }

    #chat-mode-label {
        color: #f0f;
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 1px;
    }

    .reset-chat-btn {
        background: none;
        border: none;
        font-size: 16px;
        cursor: pointer;
        opacity: 0.8;
        transition: 0.2s;
    }

    .reset-chat-btn:hover {
        opacity: 1;
        transform: scale(1.1);
    }

    .chat-feed {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        scrollbar-width: none;
        /* Hide scrollbar for cleaner look */
    }

    .chat-feed::-webkit-scrollbar {
        display: none;
    }

    .p-msg {
        padding: 12px 16px;
        border-radius: 20px;
        font-size: 14px;
        line-height: 1.4;
        max-width: 85%;
        word-wrap: break-word;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(5px);
    }

    .p-msg.public {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.1);
        align-self: flex-start;
        border-bottom-left-radius: 4px;
    }

    .p-msg.whisper {
        background: rgba(147, 51, 234, 0.3);
        color: #fff;
        border: 1px solid rgba(168, 85, 247, 0.4);
        align-self: flex-start;
        font-style: italic;
        border-bottom-left-radius: 4px;
    }

    .p-msg.mine {
        background: #E60026;
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }

    .msg-info {
        font-size: 11px;
        font-weight: 800;
        margin-bottom: 4px;
        display: block;
        opacity: 0.9;
        color: #aaa;
    }

    .msg-time {
        font-size: 10px;
        opacity: 0.6;
        margin-left: 8px;
        font-weight: 500;
    }

    .chat-controls {
        padding: 15px;
        background: rgba(0, 0, 0, 0.9);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        flex-shrink: 0;
    }

    .whisper-hint {
        font-size: 11px;
        color: #f0f;
        margin-bottom: 8px;
        font-weight: 700;
    }

    .input-wrap {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .input-wrap input {
        flex: 1;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 12px 18px;
        border-radius: 50px;
        outline: none;
        font-size: 15px;
        transition: 0.3s;
    }

    .input-wrap input:focus {
        border-color: #f0f;
        box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
    }

    .input-wrap button {
        background: linear-gradient(135deg, #f0f, #8b5cf6);
        color: white;
        border: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .input-wrap button:hover,
    .input-wrap button:active {
        transform: scale(1.1);
        box-shadow: 0 0 15px rgba(255, 0, 255, 0.6);
    }

    /* Modal */
    .party-modal {
        display: none;
        position: fixed;
        z-index: 10001;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }

    .modal-content {
        background: linear-gradient(145deg, #111 0%, #222 100%);
        margin: 0;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 30px 25px;
        border: 1px solid #0ff;
        width: 90%;
        max-width: 350px;
        border-radius: 25px;
        box-shadow: 0 10px 40px rgba(0, 255, 255, 0.2);
        animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalPop {
        from {
            transform: translate(-50%, -40%);
            opacity: 0;
        }

        to {
            transform: translate(-50%, -50%);
            opacity: 1;
        }
    }

    .close-modal {
        position: absolute;
        right: 20px;
        top: 15px;
        font-size: 32px;
        color: #888;
        cursor: pointer;
        line-height: 1;
    }

    .close-modal:hover {
        color: #fff;
    }

    .modal-body {
        text-align: center;
        color: #fff;
    }

    .modal-img {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 3px solid #f0f;
        margin-bottom: 15px;
        object-fit: cover;
        box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
    }

    .modal-name {
        font-size: 22px;
        font-weight: 900;
        margin-bottom: 8px;
        color: #0ff;
        letter-spacing: 1px;
    }

    .modal-bio {
        font-size: 13px;
        color: #aaa;
        margin-bottom: 25px;
        line-height: 1.5;
        padding: 0 10px;
    }

    .modal-btn {
        width: 100%;
        padding: 14px;
        border-radius: 30px;
        border: none;
        font-weight: 800;
        font-size: 14px;
        cursor: pointer;
        transition: 0.2s;
        margin-bottom: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        box-sizing: border-box;
    }

    .btn-whisper {
        background: #f0f;
        color: #fff;
        box-shadow: 0 4px 15px rgba(255, 0, 255, 0.3);
    }

    .btn-whisper:active {
        transform: scale(0.98);
    }

    .btn-profile {
        background: transparent;
        color: #fff;
        border: 2px solid #444;
    }

    .btn-profile:active {
        background: #333;
    }

    /* MOBILE RESPONSIVE LAYOUT */
    @media (max-width: 850px) {
        .club-wrapper {
            height: 90vh !important;
            margin: 10px auto;
            border-radius: 12px;
        }
        .main-party-layout {
            grid-template-columns: 1fr;
            grid-template-rows: minmax(150px, 1fr) 2fr;
            gap: 10px;
        }

        .avatar-arena {
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            padding: 10px;
            border-radius: 12px;
        }

        .avatar-img-wrap {
            width: 50px;
            height: 50px;
        }

        .party-chat-panel {
            border-radius: 12px;
            margin-bottom: env(safe-area-inset-bottom);
        }

        .neon-title {
            font-size: 1.8rem;
        }
    }

    /* Small mobile tweaks */
    @media (max-width: 400px) {
        .avatar-arena {
            grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
            gap: 8px;
            padding: 8px;
        }

        .avatar-img-wrap {
            width: 45px;
            height: 45px;
        }

        .neon-title {
            font-size: 1.4rem;
        }

        .party-content {
            padding: 8px;
        }
    }

    .reaction-btn {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        opacity: 0.9;
        padding: 5px;
    }
    .reaction-btn:hover {
        transform: scale(1.4);
        opacity: 1;
    }
</style>

<div class="club-wrapper">
    <video autoplay loop muted playsinline class="club-bg-video">
        <source src="/static/video/12.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="party-content">
        <div class="party-header">
            <div style="display: flex; align-items: center; gap: 15px; justify-content: center;">
                <div style="font-size: clamp(2rem, 5vw, 3.5rem); text-shadow: 0 0 15px #f0f;">{{ theme.icon }}</div>
                <div style="text-align: left;">
                    <h1 class="neon-title" style="margin: 0; line-height: 1;">{{ theme.title }}</h1>
                    <p style="color: #0ff; font-weight: 800; font-size: 14px; margin-top: 5px; text-transform: uppercase; letter-spacing: 2px;">{{ theme.desc }}</p>
                </div>
            </div>
            
            <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; z-index: 10;">
                <!-- Audio Streamer -->
                <audio id="clubAudio" controls style="height: 35px; width: 280px; border-radius: 20px; opacity: 0.9; filter: invert(0.9) hue-rotate(180deg) drop-shadow(0px 0px 10px rgba(0,255,255,0.5)); outline: none;">
                    <source src="https://stream.zeno.fm/f3wvbbqmdg8uv" type="audio/mpeg">
                </audio>
                
                <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
                    <!-- Room Switcher -->
                    <select id="roomSwitcher" onchange="switchRoom(this.value)" style="background: rgba(0,0,0,0.6); color: #0ff; border: 1px solid #0ff; padding: 8px 15px; border-radius: 20px; font-weight: bold; outline: none; cursor: pointer; backdrop-filter: blur(5px);">
                        <option value="main" style="color:black">🌐 Main Lounge</option>
                        <option value="dj" style="color:black">🎧 DJ Booth</option>
                        <option value="vip" style="color:black">💎 VIP Room</option>
                        <option value="chill" style="color:black">☕ Chill Spot</option>
                        <option value="live_video" style="color:black; font-weight: 900;">📹 Live Cam Room</option>
                    </select>
                    
                    <!-- Vibe Input -->
                    <input type="text" id="myVibeInput" placeholder="Set Status (e.g. Studying 🎧)" onblur="updateMyVibe(this.value)" style="background: rgba(0,0,0,0.6); color: #f0f; border: 1px solid #f0f; padding: 8px 15px; border-radius: 20px; outline: none; width: 180px; text-align:center; font-weight: bold; backdrop-filter: blur(5px);">
                </div>
            </div>

            <div class="party-stats" style="margin-top: 10px;">
                <div class="pulse-dot-green"></div>
                <span id="online-count">0</span> COMRADES VIBING
            </div>
        </div>

        <div class="main-party-layout" id="mainPartyLayout">
            <div class="avatar-arena" id="avatarArena">
            </div>

            <div class="party-chat-panel">
                <div class="chat-header">
                    <span id="chat-mode-label">🌐 PUBLIC CHAT</span>
                    <button class="reset-chat-btn" onclick="setChatMode('public')"
                        title="Back to public chat">🔄</button>
                </div>
                <div id="partyMessages" class="chat-feed">
                    <div style="text-align: center; color: #666; font-size: 12px; margin-top: auto; padding-top: 20px;">
                        Welcome to the club. Say hi! 👋
                    </div>
                </div>
                <div class="chat-controls">
                    <!-- Reaction Soundboard -->
                    <div style="display:flex; justify-content:center; gap:15px; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px;">
                        <button onclick="sendReaction('🔥')" class="reaction-btn">🔥</button>
                        <button onclick="sendReaction('❤️')" class="reaction-btn">❤️</button>
                        <button onclick="sendReaction('😂')" class="reaction-btn">😂</button>
                        <button onclick="sendReaction('👏')" class="reaction-btn">👏</button>
                        <button onclick="sendReaction('🎉')" class="reaction-btn">🎉</button>
                    </div>

                    <div class="whisper-hint" id="whisperHint" style="display:none;">
                        Whispering to <span id="target-name" style="color:white;">...</span>
                    </div>
                    <div class="input-wrap">
                        <input type="text" id="partyMsgInput" placeholder="Say something..."
                            onkeypress="if(event.key==='Enter') sendMsg()">
                        <button onclick="sendMsg()" id="sendBtn">🔥</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="profileModal" class="party-modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-body" id="modalBody">
        </div>
    </div>
</div>

<script>
    const currentUserId = "{{ user_id }}";
    const currentUserName = "{{ current_user }}".split(' ')[0] || "Student";
    let whisperTarget = null;
    let currentRoom = "main";
    let chatListener = null;

    function switchRoom(room) {
        currentRoom = room;
        document.getElementById("partyMessages").innerHTML = `<div style="text-align: center; color: #666; font-size: 12px; margin-top: auto; padding-top: 20px;">Welcome to the ${room.toUpperCase()} room. Say hi! 👋</div>`;
        document.getElementById("chat-mode-label").innerText = `🌐 ${room.toUpperCase()} ROOM`;
        
        // Handle Live Video Room UI
        if (room === 'live_video') {
            document.getElementById('avatarArena').style.display = 'none';
            if (!document.getElementById('liveVideoFrame')) {
                const iframe = document.createElement('iframe');
                iframe.id = 'liveVideoFrame';
                // Using meet.jit.si because other instances block iframes (X-Frame-Options)
                iframe.src = 'https://meet.jit.si/FindYourMatch_LiveRoom#config.startAudioMuted=true&config.prejoinPageEnabled=false';
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.border = '1px solid rgba(255,255,255,0.1)';
                iframe.style.borderRadius = '20px';
                iframe.allow = 'camera; microphone; fullscreen; display-capture';
                document.getElementById('mainPartyLayout').insertBefore(iframe, document.getElementById('avatarArena'));
            } else {
                document.getElementById('liveVideoFrame').style.display = 'block';
            }
        } else {
            document.getElementById('avatarArena').style.display = 'grid';
            if (document.getElementById('liveVideoFrame')) {
                document.getElementById('liveVideoFrame').style.display = 'none';
            }
        }

        if (chatListener && window.firebaseDb) {
            window.firebaseDb.ref("party_chat_" + chatListener.room).off("child_added", chatListener.fn);
        }
        listenToRoom(room);
        
        if (window.firebaseDb && currentUserId) {
            window.firebaseDb.ref("party_participants").child(currentUserId).update({ room: room });
        }
    }
    
    function updateMyVibe(vibeText) {
        if (window.firebaseDb && currentUserId) {
            window.firebaseDb.ref("party_participants").child(currentUserId).update({ vibe: vibeText });
        }
    }
    
    function sendReaction(emoji) {
        if (!window.firebaseDb) return;
        const payload = {
            sender_id: currentUserId,
            sender_name: currentUserName,
            text: `Reacted with ${emoji}`,
            is_reaction: true,
            emoji: emoji,
            timestamp_ms: Date.now()
        };
        window.firebaseDb.ref("party_chat_" + currentRoom).push(payload);
    }

    // Helper function to safely format times
    function getFormattedTime() {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    if (window.firebaseDb) {
        const partyRef = window.firebaseDb.ref('party_participants');
        const chatRef = window.firebaseDb.ref('party_chat');

        // Load active participants
        partyRef.on('value', (snapshot) => {
            const users = snapshot.val() || {};
            const arena = document.getElementById('avatarArena');
            arena.innerHTML = '';

            let count = 0;
            Object.keys(users).forEach(uid => {
                const u = users[uid];
                
                // Only show users in the current room
                if ((u.room || 'main') === currentRoom) {
                    count++;
                    const div = document.createElement('div');
                    div.className = 'avatar-item';
                    div.onclick = () => showUserModal(uid, u);

                    div.innerHTML = `
                        <div class="avatar-img-wrap shape-${u.shape_seed || 1}">
                            <img src="${u.img || '/static/img/placeholder.png'}" loading="lazy" alt="${u.name}">
                        </div>
                        <span class="avatar-name">${u.name}</span>
                        ${u.vibe ? `<span style="font-size: 9px; color: #0ff; margin-top: 3px; font-style: italic; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${u.vibe}</span>` : ""}
                    `;
                    arena.appendChild(div);
                }
            });
            document.getElementById('online-count').innerText = count;
        });

        // Initialize main room and its listeners
        switchRoom('main');

        // Cleanup on disconnect
        partyRef.child(currentUserId).onDisconnect().remove();
    }

    function setChatMode(mode, targetId = null, targetName = '') {
        const input = document.getElementById('partyMsgInput');
        const chatPanel = document.querySelector('.party-chat-panel');
        
        if (mode === 'public') {
            whisperTarget = null;
            document.getElementById('chat-mode-label').innerText = `🌐 ${currentRoom.toUpperCase()} ROOM`;
            document.getElementById('whisperHint').style.display = 'none';
            input.placeholder = "Say something to everyone...";
            chatPanel.classList.remove('whisper-active');
        } else {
            whisperTarget = targetId;
            document.getElementById('chat-mode-label').innerText = '🤫 WHISPERING';
            document.getElementById('target-name').innerText = targetName;
            document.getElementById('whisperHint').style.display = 'block';
            input.placeholder = `Whisper to ${targetName}...`;
            input.focus();
            chatPanel.classList.add('whisper-active');
        }
    }

    function sendMsg() {
        const input = document.getElementById('partyMsgInput');
        const text = input.value.trim();
        if (!text || !window.firebaseDb) return;

        const timestamp_ms = Date.now();
        const formattedTime = getFormattedTime();

        const payload = {
            sender_id: currentUserId,
            sender_name: currentUserName,
            text: text,
            is_whisper: whisperTarget !== null,
            target_id: whisperTarget || null,
            timestamp: formattedTime,
            timestamp_ms: timestamp_ms
        };

        // Optimistically show own message for instant feedback
        appendMessage(payload);

        // Push to Firebase
        window.firebaseDb.ref('party_chat_' + currentRoom).push(payload);

        input.value = '';
    }

    function appendMessage(data) {
        const feed = document.getElementById('partyMessages');
        
        if (data.is_reaction) {
            // Floating emoji animation on screen
            const floatingEmoji = document.createElement("div");
            floatingEmoji.innerText = data.emoji;
            floatingEmoji.style.position = "fixed";
            floatingEmoji.style.left = Math.random() * 80 + 10 + "%";
            floatingEmoji.style.bottom = "-50px";
            floatingEmoji.style.fontSize = "40px";
            floatingEmoji.style.pointerEvents = "none";
            floatingEmoji.style.zIndex = "999999";
            floatingEmoji.style.transition = "all 2s ease-out";
            document.body.appendChild(floatingEmoji);
            
            setTimeout(() => {
                floatingEmoji.style.bottom = "100%";
                floatingEmoji.style.opacity = "0";
                floatingEmoji.style.transform = `rotate(${Math.random()*360}deg) scale(1.5)`;
            }, 50);
            
            setTimeout(() => floatingEmoji.remove(), 2000);
            return;
        }

        const isMine = data.sender_id === currentUserId;

        // Remove the empty placeholder if it exists
        const placeholder = feed.querySelector('div[style*="text-align: center"]');
        if (placeholder) placeholder.remove();

        const div = document.createElement('div');
        div.className = `p-msg ${isMine ? 'mine' : (data.is_whisper ? 'whisper' : 'public')}`;

        let senderHtml = '';
        if (!isMine) {
            senderHtml = `<span class="msg-info">${data.is_whisper ? '🤫 Whisper from ' : ''}${data.sender_name}</span>`;
        }

        div.innerHTML = `
            ${senderHtml}
            ${data.text}
            <span class="msg-time">${data.timestamp || getFormattedTime()}</span>
        `;

        feed.appendChild(div);

        // Smooth scroll to bottom
        feed.scrollTo({
            top: feed.scrollHeight,
            behavior: 'smooth'
        });
    }

    function showUserModal(uid, data) {
        if (uid === currentUserId) return;

        const body = document.getElementById('modalBody');
        body.innerHTML = `
            <img src="${data.img || '/static/img/placeholder.png'}" class="modal-img">
            <div class="modal-name">${data.name}</div>
            <div class="modal-bio">Verified student vibing in the club.</div>
            ${data.phone ? `<div style="color: #E60026; font-weight: 900; margin-bottom: 10px; font-size: 1.1rem;">📞 +${data.phone}</div>` : ''}
            <button class="modal-btn btn-whisper" onclick="startWhisper('${uid}', '${data.name}')">
                🤫 Whisper Privately
            </button>
            <a href="/student/${uid}" class="modal-btn btn-profile">
                👀 View Full Profile
            </a>
        `;
        document.getElementById('profileModal').style.display = 'block';
    }

    function startWhisper(uid, name) {
        setChatMode('whisper', uid, name);
        closeModal();
    }

    function closeModal() {
        document.getElementById('profileModal').style.display = 'none';
    }

    window.onclick = function (event) {
        const modal = document.getElementById('profileModal');
        if (event.target === modal) {
            closeModal();
        }
    }

    window.addEventListener('beforeunload', () => {
        if (window.firebaseDb && currentUserId) {
            window.firebaseDb.ref('party_participants').child(currentUserId).remove();
        }
    });
    
    // Override the old chat listener logic to support rooms
    function listenToRoom(room) {
        if (!window.firebaseDb) return;
        const ref = window.firebaseDb.ref("party_chat_" + room).orderByChild("timestamp_ms").startAt(Date.now());
        
        const fn = ref.on("child_added", (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            if (data.is_whisper && data.target_id !== currentUserId && data.sender_id !== currentUserId) return;
            if (data.sender_id === currentUserId && !data.is_reaction) return; 
            
            appendMessage(data);
        });
        
        chatListener = { room: room, fn: fn };
    }
</script>
{% endblock %}
