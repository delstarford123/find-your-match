{% extends "base.html" %}

{% block content %}
<style>
    /* Force hide the global footer from base.html on this page only */
    footer, .footer-bottom, .bottom-nav {
        display: none !important;
    }
    
    /* Ensure the main container fills the screen without scrollbars from the footer */
    main, body {
        overflow: hidden !important;
        height: 100vh !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    .club-wrapper {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #000;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    <!-- 1. Background Video -->
    <video autoplay loop muted playsinline class="club-bg-video">
        <source src="/static/video/12.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="party-content">
        <div class="party-header">
            <h1 class="neon-title">COMRADES NIGHT CLUB</h1>
            <div class="party-stats">
                <span id="online-count">0</span> COMRADES VIBING
            </div>
        </div>

        <div class="main-party-layout">
            <!-- Left: Avatar Grid -->
            <div class="avatar-arena" id="avatarArena">
                <!-- Avatars injected here by JS -->
            </div>

            <!-- Right: Chat Panel -->
            <div class="party-chat-panel">
                <div class="chat-header">
                    <span id="chat-mode-label">🌐 PUBLIC CHAT</span>
                    <button class="reset-chat-btn" onclick="setChatMode('public')" title="Back to public chat">🔄</button>
                </div>
                <div id="partyMessages" class="chat-feed"></div>
                <div class="chat-controls">
                    <div class="whisper-hint" id="whisperHint" style="display:none;">
                        Whispering to <span id="target-name">...</span>
                    </div>
                    <div class="input-wrap">
                        <input type="text" id="partyMsgInput" placeholder="Say something..." onkeypress="if(event.key==='Enter') sendMsg()">
                        <button onclick="sendMsg()" id="sendBtn">🔥</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Profile Quick-View Modal -->
<div id="profileModal" class="party-modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-body" id="modalBody">
            <!-- Data injected here -->
        </div>
    </div>
</div>

<style>
    /* club-wrapper & Video */
    .club-wrapper {
        position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
        background: #000; overflow: hidden; z-index: 1000;
    }
    .club-bg-video {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        min-width: 100%; min-height: 100%; width: auto; height: auto;
        object-fit: cover; filter: brightness(0.4) blur(2px);
    }
    .video-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%);
    }

    .party-content {
        position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column;
        padding: 20px; box-sizing: border-box;
    }

    .neon-title {
        text-align: center; color: #fff; font-size: 2.5rem; font-weight: 900;
        text-shadow: 0 0 10px #f0f, 0 0 20px #f0f, 0 0 40px #0ff;
        margin: 0 0 10px; font-family: 'Black Ops One', cursive, sans-serif;
    }

    .party-stats { text-align: center; color: #0ff; font-weight: 800; letter-spacing: 2px; font-size: 0.9rem; }

    .main-party-layout {
        flex: 1; display: grid; grid-template-columns: 1fr 350px; gap: 20px;
        margin-top: 20px; overflow: hidden;
    }

    /* Avatars */
    .avatar-arena {
        background: rgba(255,255,255,0.05); border-radius: 20px;
        backdrop-filter: blur(10px); border: 1px solid rgba(0,255,255,0.2);
        display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        grid-auto-rows: 120px; gap: 15px; padding: 20px; overflow-y: auto;
    }

    .avatar-item {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        cursor: pointer; transition: 0.3s;
    }
    .avatar-item:hover { transform: scale(1.1) rotate(5deg); }
    
    .avatar-img-wrap {
        width: 70px; height: 70px; border: 3px solid #f0f;
        box-shadow: 0 0 15px rgba(255,0,255,0.5); overflow: hidden;
        /* Dynamic shapes will be applied via seed-based classes */
    }
    .avatar-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    
    .avatar-name { margin-top: 8px; font-size: 11px; font-weight: 900; color: #fff; text-shadow: 0 0 5px #000; }

    /* CSS Shapes based on shape_seed */
    .shape-1 { border-radius: 50%; }
    .shape-2 { border-radius: 15% 50% 15% 50%; }
    .shape-3 { border-radius: 50% 15% 50% 15%; }
    .shape-4 { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
    .shape-5 { border-radius: 50% 50% 50% 0%; }
    .shape-6 { border-radius: 0% 50% 50% 50%; }
    .shape-7 { border-radius: 25% 25% 25% 25%; transform: rotate(45deg); }
    .shape-7 img { transform: rotate(-45deg); }
    .shape-8 { border-radius: 50% 50% 0 0; }

    /* Chat Panel */
    .party-chat-panel {
        background: rgba(0,0,0,0.8); border-radius: 20px;
        border: 2px solid #f0f; display: flex; flex-direction: column; overflow: hidden;
        box-shadow: 0 0 30px rgba(255,0,255,0.2);
    }
    .chat-header {
        padding: 15px; border-bottom: 1px solid #333; display: flex;
        justify-content: space-between; align-items: center; background: #111;
    }
    #chat-mode-label { color: #f0f; font-weight: 900; font-size: 13px; }
    .reset-chat-btn { background: none; border: none; font-size: 18px; cursor: pointer; }

    .chat-feed { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .p-msg { padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.4; max-width: 85%; }
    .p-msg.public { background: #222; color: #eee; border-left: 3px solid #0ff; align-self: flex-start; }
    .p-msg.whisper { background: #300; color: #ffccd5; border-left: 3px solid #f0f; align-self: flex-start; font-style: italic; }
    .p-msg.mine { background: #E60026; color: white; align-self: flex-end; border-left: none; border-right: 3px solid #fff; }
    
    .msg-info { font-size: 10px; font-weight: 900; margin-bottom: 3px; display: block; opacity: 0.8; }
    .msg-time { font-size: 9px; opacity: 0.5; margin-left: 5px; font-weight: 400; }

    .chat-controls { padding: 15px; background: #111; }
    .whisper-hint { font-size: 11px; color: #f0f; margin-bottom: 8px; font-weight: 700; }
    .input-wrap { display: flex; gap: 10px; }
    .input-wrap input {
        flex: 1; background: #222; border: 1px solid #444; color: #fff;
        padding: 10px 15px; border-radius: 25px; outline: none; font-size: 14px;
    }
    .input-wrap button {
        background: #f0f; border: none; width: 40px; height: 40px;
        border-radius: 50%; cursor: pointer; font-size: 18px; transition: 0.2s;
    }
    .input-wrap button:hover { transform: scale(1.1); box-shadow: 0 0 15px #f0f; }

    /* Modal */
    .party-modal {
        display: none; position: fixed; z-index: 10001; left: 0; top: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
    }
    .modal-content {
        background: #111; margin: 15% auto; padding: 25px; border: 2px solid #0ff;
        width: 90%; max-width: 400px; border-radius: 25px; position: relative;
        box-shadow: 0 0 40px #0ff;
    }
    .close-modal { position: absolute; right: 20px; top: 15px; font-size: 28px; color: #888; cursor: pointer; }
    .modal-body { text-align: center; color: #fff; }
    .modal-img { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #f0f; margin-bottom: 15px; object-fit: cover; }
    .modal-name { font-size: 24px; font-weight: 900; margin-bottom: 5px; color: #0ff; }
    .modal-bio { font-size: 14px; color: #ccc; margin-bottom: 20px; line-height: 1.5; }
    .modal-btn {
        width: 100%; padding: 12px; border-radius: 30px; border: none; font-weight: 900;
        cursor: pointer; transition: 0.3s; margin-bottom: 10px;
    }
    .btn-whisper { background: #f0f; color: #fff; }
    .btn-profile { background: #222; color: #fff; border: 1px solid #444; }

    @media (max-width: 800px) {
        .main-party-layout { grid-template-columns: 1fr; }
        .party-chat-panel { height: 400px; }
        .neon-title { font-size: 1.5rem; }
    }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<script>
    const socket = io();
    const currentUserId = "{{ user_id }}";
    let whisperTarget = null;

    // 1. Join Room
    socket.emit('join_party', {});

    // 2. Initial Data Fetch (Who is in the party?)
    async function refreshAvatars() {
        const arena = document.getElementById('avatarArena');
        // We fetch this from Firebase directly or via a route
        // For efficiency, let's use a Firebase listener
    }

    // Firebase Listener for Presence
    const partyRef = window.firebaseDb.ref('party_participants');
    partyRef.on('value', (snapshot) => {
        const users = snapshot.val() || {};
        const arena = document.getElementById('avatarArena');
        arena.innerHTML = '';
        
        let count = 0;
        Object.keys(users).forEach(uid => {
            const u = users[uid];
            count++;
            
            const div = document.createElement('div');
            div.className = 'avatar-item';
            div.onclick = () => showUserModal(uid, u);
            
            div.innerHTML = `
                <div class="avatar-img-wrap shape-${u.shape_seed || 1}">
                    <img src="${u.img || '/static/img/placeholder.png'}">
                </div>
                <span class="avatar-name">${u.name}</span>
            `;
            arena.appendChild(div);
        });
        document.getElementById('online-count').innerText = count;
    });

    // 3. Chat Logic
    function setChatMode(mode, targetId = null, targetName = '') {
        if (mode === 'public') {
            whisperTarget = null;
            document.getElementById('chat-mode-label').innerText = '🌐 PUBLIC CHAT';
            document.getElementById('whisperHint').style.display = 'none';
        } else {
            whisperTarget = targetId;
            document.getElementById('chat-mode-label').innerText = '🤫 WHISPERING';
            document.getElementById('target-name').innerText = targetName;
            document.getElementById('whisperHint').style.display = 'block';
        }
    }

    function sendMsg() {
        const input = document.getElementById('partyMsgInput');
        const text = input.value.trim();
        if (!text) return;

        socket.emit('send_party_msg', {
            text: text,
            target_id: whisperTarget
        });
        input.value = '';
    }

    socket.on('receive_party_msg', (data) => {
        const feed = document.getElementById('partyMessages');
        const isMine = data.sender_id === currentUserId;
        
        const div = document.createElement('div');
        div.className = `p-msg ${isMine ? 'mine' : (data.is_whisper ? 'whisper' : 'public')}`;
        
        div.innerHTML = `
            ${!isMine ? `<span class="msg-info">${data.is_whisper ? '🤫 Whisper from ' : ''}${data.sender_name}</span>` : ''}
            ${data.text}
            <span class="msg-time">${data.timestamp}</span>
        `;
        
        feed.appendChild(div);
        feed.scrollTop = feed.scrollHeight;
    });

    // 4. Modal Logic
    function showUserModal(uid, data) {
        if (uid === currentUserId) return;
        
        const body = document.getElementById('modalBody');
        body.innerHTML = `
            <img src="${data.img}" class="modal-img">
            <div class="modal-name">${data.name}</div>
            <div class="modal-bio">Masinde Muliro comrade vibing in the club.</div>
            <button class="modal-btn btn-whisper" onclick="startWhisper('${uid}', '${data.name}')">🤫 Whisper Privately</button>
            <a href="/student/${uid}" class="modal-btn btn-profile" style="display:block; text-decoration:none;">👀 View Full Profile</a>
        `;
        document.getElementById('profileModal').style.display = 'block';
    }

    function startWhisper(uid, name) {
        setChatMode('whisper', uid, name);
        closeModal();
    }

    function closeModal() {
        document.getElementById('profileModal').style.display = 'none';
    }

    // Cleanup on leave
    window.onbeforeunload = () => {
        socket.emit('leave_party', {});
    };
</script>
{% endblock %}
