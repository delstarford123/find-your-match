name: Hourly Anti-Ghosting & Cron Check

on:
  schedule:
    # Runs at the top of every hour (0 * * * *)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger FYM Hourly Anti-Ghosting & Schedulers
        run: |
          curl -s -f -X GET "https://findyourmatch.co.ke/api/cron/hourly-check?cron_key=mmust_dating_cron_secret_2026"
